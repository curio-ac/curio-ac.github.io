<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curio</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--hl:#2F5BFF;--hl-text:#8EA6FF;--ink:#000;--paper:#fff;--dim:rgba(255,255,255,.62);--line:rgba(255,255,255,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;max-width:520px;margin:0 auto;user-select:none;background:#000}
.bg,.bigemo,.emo{display:none}
.img{position:absolute;inset:0;opacity:0;transition:opacity .3s;overflow:hidden}
.img i{position:absolute;inset:0;background-size:cover;background-position:center}
.img.on{opacity:1;z-index:1}
.img.e0,.img.e2{animation:fadein .3s ease-out}.img.e1{animation:slidein .3s cubic-bezier(.2,.8,.2,1)}.img.e3{animation:zoomin .35s ease-out}
@keyframes fadein{from{opacity:0}}@keyframes slidein{from{transform:translateX(30%)}}@keyframes zoomin{from{transform:scale(1.15)}}
.img i.m0{animation:m0 3.6s ease-out forwards}.img i.m1{animation:m1 3.6s ease-out forwards}.img i.m2{animation:m2 3.6s linear forwards}
.img i.m3{animation:m3 3.6s linear forwards}.img i.m4{animation:m4 3.6s ease-out forwards}.img i.m5{animation:m5 3.6s ease-out forwards}
@keyframes m0{from{transform:scale(1.04)}to{transform:scale(1.22)}}
@keyframes m1{from{transform:scale(1.24)}to{transform:scale(1.05)}}
@keyframes m2{from{transform:scale(1.2) translateX(5%)}to{transform:scale(1.2) translateX(-5%)}}
@keyframes m3{from{transform:scale(1.2) translateX(-5%)}to{transform:scale(1.2) translateX(5%)}}
@keyframes m4{from{transform:scale(1.2) translateY(4%)}to{transform:scale(1.22) translateY(-4%)}}
@keyframes m5{from{transform:scale(1.08) translate(-3%,3%)}to{transform:scale(1.24) translate(3%,-3%)}}
.shade{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.8))}
.withvis .shade{background:rgba(0,0,0,.66)}
.stat{position:absolute;top:21%;left:24px;right:24px;z-index:3;display:none;font-size:clamp(34px,10vw,48px);font-weight:700;line-height:1.1}
.stat small{display:block;font-size:.45em;font-weight:500;color:var(--dim);margin-top:6px}
.noimg .stat{display:block;animation:fadein .3s}
.noimg .img{opacity:0!important}
.vis{position:absolute;top:19%;left:22px;right:22px;height:44%;z-index:3;display:none;flex-direction:column;justify-content:center;pointer-events:none}
.vis.on{display:flex;animation:fadein .3s}
.v-num{font-size:clamp(60px,19vw,96px);font-weight:700;line-height:1;letter-spacing:-.02em}
.v-num b{font-weight:700;background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%);padding:0 .05em}
.v-num small{font-size:.32em;font-weight:500;color:var(--dim);margin:0 .3em}
.v-lab{font-size:18px;font-weight:500;color:var(--dim);margin-top:12px}
.v-bar{height:16px;background:var(--hl);margin-top:18px;transform-origin:right;animation:grow .7s ease-out both}
.post[dir=ltr] .v-bar{transform-origin:left}
.v-segs{display:flex;gap:3px;margin-top:6px;height:16px}
.v-segs i{flex:none;height:100%;border:1.5px solid #fff;animation:fadein .25s both}
@keyframes grow{from{transform:scaleX(0)}}
.v-map{width:100%;max-height:100%;display:block}
.v-map g{transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
.v-map .pin{fill:var(--hl-text)}.v-map .ring{fill:none;stroke:var(--hl-text);stroke-width:.6;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{r:1;opacity:1}to{r:8;opacity:0}}
.v-tl{position:relative;height:56px;margin-top:22px;direction:ltr}
.v-tl .ax{position:absolute;top:20px;left:0;right:0;height:2px;background:var(--line)}
.v-tl .dot{position:absolute;top:13px;width:16px;height:16px;margin-left:-8px;background:var(--hl);transition:left 1.2s cubic-bezier(.6,0,.2,1)}
.v-tl .end{position:absolute;top:34px;font-size:14px;color:var(--dim)}
.fbox{position:absolute;border:3px solid var(--hl);box-shadow:0 0 0 2000px rgba(0,0,0,.4);animation:fadein .4s .5s both}
.img i.fz{animation:none!important;transition:transform 1.2s cubic-bezier(.6,0,.2,1)}
.cap{position:absolute;top:60%;left:72px;right:22px;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:2px 8px;z-index:3;pointer-events:none}
.post[dir=ltr] .cap{left:22px;right:72px}
.cap.pop{animation:fadein .15s}
.cap span{font-size:clamp(22px,6.2vw,28px);font-weight:600;line-height:1.3;padding:0 3px;text-shadow:0 1px 8px rgba(0,0,0,.6);transition:background-color .12s,color .12s}
.cap span.on{background:var(--hl);color:#fff;text-shadow:none}
.prog{position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--line);z-index:4}
.prog i{display:block;height:100%;width:0;background:#fff}
.meta{position:absolute;bottom:20px;right:20px;left:80px;z-index:3}
.post[dir=ltr] .meta{left:20px;right:80px}
.ttl{position:absolute;top:62px;left:22px;right:22px;z-index:4;font-size:24px;font-weight:700;line-height:1.2;text-shadow:0 1px 10px rgba(0,0,0,.6);transform-origin:top right;transition:transform .5s cubic-bezier(.3,0,.2,1)}
.post[dir=ltr] .ttl{transform-origin:top left}
.ttl.big{transform:scale(1.45)}
.ttl i{display:block;width:36px;height:4px;background:var(--hl);margin-top:8px}
.cat{display:block;font-size:13px;font-weight:600;color:var(--hl-text);margin-bottom:2px}
.meta h2{font-size:16px;font-weight:600;margin-bottom:6px}
.meta a{color:#fff;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.credit{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.actions{position:absolute;left:10px;bottom:96px;display:flex;flex-direction:column;gap:18px;z-index:3}
.post[dir=ltr] .actions{left:auto;right:10px}
.actions button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;cursor:pointer;width:52px;font:inherit}
.actions svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.actions button.on svg{fill:var(--hl);stroke:var(--hl)}
.actions small{font-size:11px;margin-top:3px;font-weight:500}
.pz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none}
.post.paused .pz{display:flex}
#top{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;max-width:520px;margin:0 auto}
.logo{font-weight:700;font-size:21px;letter-spacing:-.01em;direction:ltr;padding:0 3px;background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%);text-shadow:0 1px 6px rgba(0,0,0,.5)}
#top button{background:none;border:0;color:#fff;width:40px;height:40px;cursor:pointer}
#top svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.quiz{position:absolute;inset:96px 24px 110px;display:flex;flex-direction:column;justify-content:center;gap:10px;z-index:3}
.quiz .tag{font-size:14px;font-weight:600;color:var(--hl-text)}
.quiz h3{font-size:clamp(24px,6.6vw,30px);font-weight:700;margin-bottom:12px;line-height:1.25}
.quiz button{font:inherit;font-size:17px;font-weight:500;padding:14px 16px;border:1.5px solid var(--line);background:none;color:#fff;cursor:pointer;text-align:start}
.quiz button.ok{background:var(--hl);border-color:var(--hl);color:#fff}
.quiz button.bad{border-color:#ff5a4e;color:#ff5a4e}
.quiz .x{font-size:16px;opacity:0;transition:opacity .3s;line-height:1.5;margin-top:8px;color:var(--dim)}
.quiz .x.on{opacity:1}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
#panel{background:rgba(0,0,0,.92);display:none}
#panel.on{display:flex}
#panel .box{width:100%;max-width:400px}
#panel h3{font-size:22px;font-weight:700;margin-bottom:4px}
#panel .sub{color:var(--dim);font-size:14px;margin-bottom:20px;line-height:1.5}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:15px}
.row span{width:90px}
.row .bar{flex:1;height:8px;background:var(--line)}
.row .bar i{display:block;height:100%;background:var(--hl)}
#panel button{font:inherit;margin-top:22px;background:#fff;color:#000;border:0;padding:10px 26px;font-weight:600;cursor:pointer}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;font-size:14px;font-weight:500;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#unmute{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.6);padding:8px 14px;font-size:14px;font-weight:500;pointer-events:none;white-space:nowrap}
#unmute svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){.img i[class^=m]{animation:none!important}.v-bar{animation:none}}
</style>
</head>
<body>
<div id="top"><div class="logo">curio</div><div><button id="btnStats" aria-label="מה האלגוריתם למד"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-11"/></svg></button><button id="btnSound" aria-label="קול"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg></button></div></div>
<div id="feed"></div>
<div id="panel" class="ov"><div class="box"><h3>מה האלגוריתם למד עליך</h3><div class="sub">לייק, שמירה וצפייה עד הסוף מגדילים משקל. דילוג מהיר מקטין.</div><div id="rows"></div><button id="closePanel">סגור</button></div></div>
<div id="toast"></div>
<div id="unmute"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg><span>הקש להפעלת קול · Tap to unmute</span></div>
<script src="world.js"></script>
<script>
// התוכן מגיע מבחוץ ומתעדכן ברקע: האפליקציה היא רק נגן
const REPO="curio-ac/curio-ac.github.io",CDN=`https://raw.githubusercontent.com/${REPO}/main/`,FEED_URL=`https://raw.githubusercontent.com/${REPO}/main/content/feed.json`;
let V=[];const AUD={},FULL={};
async function loadFeed(){try{const r=await fetch(FEED_URL+"?t="+Date.now(),{cache:"no-store"});const f=await r.json();
  const have=new Set(V.map(x=>x.id));let n=0;for(const e of f.videos)if(!have.has(e.id)){V.push(e);AUD[e.id]=CDN+`audio/${e.lang}/${e.id}.mp3`;n++}
  if(n&&have.size)fresh+=n;return n}catch(e){return 0}}
let fresh=0;
async function full(e){if(!FULL[e.id])FULL[e.id]=fetch(CDN+`content/${e.lang}/${e.id}.json`).then(r=>r.json()).then(v=>{prep(v);return v});return FULL[e.id]}
const CATS={space:["#1b1464","#05010f","חלל","Space"],biology:["#0b6e4f","#08251c","ביולוגיה","Biology"],history:["#9c4f1c","#2b1206","היסטוריה","History"],
 math:["#3a0ca3","#10002b","מתמטיקה","Math"],geography:["#0077b6","#03045e","גאוגרפיה","Geography"],physics:["#c9184a","#3d0814","פיזיקה","Physics"],
 chemistry:["#e09f3e","#4a2c06","כימיה","Chemistry"],language:["#5f0f40","#1a0412","שפה","Language"],psychology:["#7209b7","#22033a","פסיכולוגיה","Psychology"],
 art:["#bc6c25","#283618","אמנות","Art"],economics:["#2a9d8f","#0b2d29","כלכלה","Economics"],technology:["#3a86ff","#03113a","טכנולוגיה","Technology"],medicine:["#e63946","#3a0a0f","רפואה","Medicine"]};
const lab=(c,l)=>(CATS[c]||[])[l==="en"?3:2]||c;
const Q=[];let LANGS=["he"];

// ---------- הכנת כתוביות: חלוקה לקבוצות של עד 3 מילים ----------
function prep(v){
  const {w,b}=v.tim;v.chunks=[];
  b.forEach((st,si)=>{const en=si+1<b.length?b[si+1]:w.length;let c=null;
    for(let k=st;k<en;k++){if(!c){c={s:w[k][1],si,ws:[]};v.chunks.push(c)}c.ws.push(k);
      const len=c.ws.reduce((a,j)=>a+w[j][0].length,0);
      if(c.ws.length>=3||/[.,:?!]$/.test(w[k][0])||len>13)c=null}});
}

// ---------- אחסון מקומי ----------
let st={};try{st=JSON.parse(localStorage.getItem("curio")||"{}")}catch(e){}
const W=st.w||{},liked=new Set(st.l||[]),saved=new Set(st.s||[]);
const save=()=>{try{localStorage.setItem("curio",JSON.stringify({w:W,l:[...liked],s:[...saved]}))}catch(e){}};
const w=c=>W[c]??1;
const bump=(c,d)=>{W[c]=Math.round(Math.max(.2,Math.min(10,w(c)+d))*100)/100;save()};

// ---------- האלגוריתם ----------
const shownQ={},used=new Set(),quizDone=new Set(),seenRefs=new Set();let sinceQuiz=0;
function pick(){
  if(sinceQuiz>=4){const q=Q.find(q=>!quizDone.has(q.id)&&seenRefs.has(q.ref));if(q){quizDone.add(q.id);sinceQuiz=0;return{quiz:q,cat:q.cat}}}
  let pool=V.filter(x=>!used.has(x.id)&&LANGS.includes(x.lang)&&!(x.qid&&shownQ[x.qid]&&shownQ[x.qid]!==x.lang)); // אותו נושא לא יופיע בשתי שפות
  if(fresh>0){const nw=pool.filter(x=>x.created===V.reduce((m,y)=>y.created>m?y.created:m,""));if(nw.length){fresh--;const x=nw[0];used.add(x.id);if(x.qid)shownQ[x.qid]=x.lang;sinceQuiz++;return x}}
  if(!pool.length){used.clear();toast("מתחילים סבב חדש");pool=V.filter(x=>LANGS.includes(x.lang)&&!(x.qid&&shownQ[x.qid]&&shownQ[x.qid]!==x.lang))}
  let r=Math.random()*pool.reduce((a,x)=>a+w(x.cat),0);
  for(const x of pool){r-=w(x.cat);if(r<=0){used.add(x.id);if(x.qid)shownQ[x.qid]=x.lang;sinceQuiz++;return x}}
  if(!pool.length)return null;used.add(pool[0].id);if(pool[0].qid)shownQ[pool[0].qid]=pool[0].lang;return pool[0];
}

// ---------- רינדור ----------
const feed=document.getElementById("feed");
function render(it){
  const el=document.createElement("section");el.className="post";el._it=it;
  const [c1,c2]=CATS[it.cat]||["#333","#000"];el.dir=it.lang==="en"?"ltr":"rtl";el.style.setProperty("--c1",c1);el.style.setProperty("--c2",c2);
  if(it.quiz){
    const q=it.quiz;
    el.innerHTML=`<div class="bg"></div><div class="quiz"><div class="tag">בדיקה קטנה</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}<div class="x">${q.x}<br><small>גללו להמשך ↑</small></div></div>`;
    el.querySelectorAll(".quiz button").forEach(b=>b.onclick=()=>{
      if(el._ans)return;el._ans=1;const ok=+b.dataset.i===q.a;
      b.classList.add(ok?"ok":"bad");el.querySelector(`[data-i="${q.a}"]`).classList.add("ok");
      el.querySelector(".x").classList.add("on");bump(q.cat,ok?.3:.8);
    });
    return el;
  }
  const en=it.lang==="en",ims=it.images||[];if(ims.length)el.classList.add("has-img");
  el.innerHTML=`<div class="bg"></div><div class="bigemo">${it.emoji}</div>${ims.map(m=>`<div class="img"><i style="background-image:url('${(window.IMG&&IMG[m.url])||m.url}')"></i></div>`).join("")}<div class="shade"></div><div class="stat"></div><div class="vis"></div><div class="emo">${it.emoji}</div><div class="cap"></div><div class="pz"><svg viewBox="0 0 80 80" width="76" height="76"><circle cx="40" cy="40" r="38" fill="rgba(0,0,0,.35)"/><path d="M32 25 L57 40 L32 55 Z" fill="#fff"/></svg></div>
  <div class="actions">
    <button class="like${liked.has(it.id)?" on":""}"><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/></svg><small>${en?"Like":"אהבתי"}</small></button>
    <button class="sv${saved.has(it.id)?" on":""}"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg><small>${en?"Save":"שמירה"}</small></button>
    <button class="sh"><svg viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 13.5V20h14v-6.5"/></svg><small>${en?"Share":"שיתוף"}</small></button>
  </div>
  <div class="ttl">${it.title}<i></i></div><div class="meta"><span class="cat">${lab(it.cat,it.lang)}</span><a href="${it.source.url}" target="_blank" rel="noopener">${en?"Source: ":"מקור: "}${it.source.name||"Wikipedia"}</a><div class="credit">${en?"Facts checked against the source. Narration: synthetic voice.":"העובדות נבדקו מול המקור. קריינות: קול סינתטי."} ${en?"Text license":"רישיון הטקסט"}: ${it.source.license||"CC BY-SA 4.0"}.<br><span class="ic"></span></div></div><div class="prog"><i></i></div>`;
  showChunk(el,it,0);
  const lk=el.querySelector(".like"),sv=el.querySelector(".sv");
  lk.onclick=()=>{const on=!liked.has(it.id);on?liked.add(it.id):liked.delete(it.id);bump(it.cat,on?2:-2);lk.classList.toggle("on",on)};
  sv.onclick=()=>{const on=!saved.has(it.id);on?saved.add(it.id):saved.delete(it.id);bump(it.cat,on?1.5:-1.5);sv.classList.toggle("on",on);toast(on?(en?"Saved":"נשמר"):(en?"Removed":"הוסר מהשמורים"))};
  el.querySelector(".sh").onclick=()=>{const txt=`${it.title} | Curio\n${it.source.url}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(en?"Link copied":"הקישור הועתק"),()=>toast("לא ניתן להעתיק כאן"))};
  el.addEventListener("click",e=>{
    if(e.target.closest("button,a")||!cur||cur.el!==el)return;
    const x=(e.clientX-el.getBoundingClientRect().left)/el.offsetWidth;
    const L=el.dir==="ltr";if(L?x>.7:x<.3)seekSlide(1);else if(L?x<.3:x>.7)seekSlide(-1);else togglePause();
  });
  return el;
}
function showChunk(el,it,ci){
  const c=it.chunks[ci],cap=el.querySelector(".cap"),w=it.tim.w;
  cap.innerHTML=c.ws.map(j=>`<span data-j="${j}"${/\d/.test(w[j][0])?' class="num"':""}>${w[j][0]}</span>`).join("");
  cap.classList.remove("pop");void cap.offsetWidth;cap.classList.add("pop");
  if(el._si!==c.si){el._si=c.si;const e=el.querySelector(".emo");e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");
    el.querySelector(".bg").style.filter=`hue-rotate(${c.si*18}deg) brightness(${1-c.si*.04})`}
  el._ci=ci;
}
let pending=0;
async function add(){const e=pick();if(!e)return;let it=e;if(!e.quiz){try{it=await full(e)}catch(err){return}}const el=render(it);feed.appendChild(el);io.observe(el)}
function ensure(n){if(!V.length)return;while(feed.children.length+pending<n){pending++;add().finally(()=>{pending--})}}

// ---------- שכבת מידע ויזואלית ----------
const REF={length:[["human",1.7,"🧍","בני אדם","people"],["bus",12,"🚌","אוטובוסים","buses"],["football_field",105,"🏟️","מגרשי כדורגל","football fields"],["eiffel_tower",330,"🗼","מגדלי אייפל","Eiffel Towers"]],
  mass:[["human",70,"🧍","בני אדם","people"],["car",1500,"🚗","מכוניות","cars"],["elephant",6000,"🐘","פילים","elephants"]]};
const fmt=(n,l)=>(+n).toLocaleString(l==="en"?"en-US":"he-IL",{maximumFractionDigits:1});
function countUp(node,to,l){const t0=performance.now();const f=()=>{const p=Math.min(1,(performance.now()-t0)/900),e=1-Math.pow(1-p,3);node.textContent=fmt(Number.isInteger(+to)?Math.round(to*e):to*e,l);if(p<1)requestAnimationFrame(f)};f()}
function showVis(el,it,si){
  const box=el.querySelector(".vis"),v=(it.vis||[])[si]||{type:"image"},en=it.lang==="en";box.className="vis";box.innerHTML="";el.classList.remove("withvis");
  if(v.type==="stat"){box.innerHTML=`<div class="v-num"><b></b><small>${v.unit||""}</small></div><div class="v-lab">${v.label||""}</div>`;countUp(box.querySelector("b"),v.value,it.lang)}
  else if(v.type==="compare"){const refs=REF[v.dim]||[];const r=refs.find(x=>v.value/x[1]<=12&&v.value/x[1]>=1.2)||refs[refs.length-1];if(!r)return;
    const n=v.value/r[1],w=100/n;let seg="";for(let k=0;k<Math.ceil(n)&&k<13;k++)seg+=`<i style="width:calc(${Math.min(w,100-k*w)}% - 3px);animation-delay:${.5+k*.08}s"></i>`;
    const u=v.dim==="mass"?(en?"kg":"ק״ג"):(en?"m":"מ׳");
    box.innerHTML=`<div class="v-num"><b>${fmt(v.value,it.lang)}</b><small>${u}</small></div><div class="v-bar"></div><div class="v-segs">${seg}</div><div class="v-lab">${en?"About "+fmt(n,"en")+" "+r[4]+" ("+r[1]+" "+u+" each)":"בערך "+fmt(n,"he")+" "+r[3]+" (כל אחד "+r[1]+" "+u+")"}</div>`}
  else if(v.type==="map"&&it.geo&&window.WORLD){const x=it.geo[1]+180,y=90-it.geo[0];
    box.innerHTML=`<svg class="v-map" viewBox="0 0 360 180"><g><path d="${WORLD}" fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.55)" stroke-width=".25"/><circle class="ring" cx="${x}" cy="${y}" r="3"/><circle class="pin" cx="${x}" cy="${y}" r="2.2"/></g></svg><div class="v-lab">${it.geo[0].toFixed(1)}°, ${it.geo[1].toFixed(1)}°</div>`;
    const g=box.querySelector("g");setTimeout(()=>{g.style.transform=`translate(180px,90px) scale(3.2) translate(${-x}px,${-y}px)`},350)}
  else if(v.type==="timeline"){const now=new Date().getFullYear(),ago=now-v.year,yr=v.year<0?`${-v.year} ${en?"BCE":"לפנה״ס"}`:v.year;
    box.innerHTML=`<div class="v-num">${yr}</div><div class="v-lab">${en?"≈ "+fmt(ago,"en")+" years ago":"לפני כ־"+fmt(ago,"he")+" שנה"}</div><div class="v-tl"><div class="ax"></div><div class="dot" style="left:100%"></div><span class="end" style="left:0">${yr}</span><span class="end" style="right:0">${en?"today":"היום"}</span></div>`;
    setTimeout(()=>{box.querySelector(".dot").style.left="4%"},300)}
  else return;
  box.classList.add("on");el.classList.add("withvis");
}
function focusImg(el,it,si,m,i){
  const v=(it.vis||[])[si]||{};if(v.type!=="focus"||!v.box)return false;const im=it.images[it.sent_img[si]];if(!im||!im.w)return false;
  const W=el.offsetWidth,H=el.offsetHeight,s=Math.max(W/im.w,H/im.h),dw=im.w*s,dh=im.h*s,ox=(W-dw)/2,oy=(H-dh)/2,[y0,x0,y1,x1]=v.box.map(z=>z/1000);
  const L=ox+x0*dw,T=oy+y0*dh,BW=(x1-x0)*dw,BH=(y1-y0)*dh,cx=(L+BW/2)/W*100,cy=(T+BH/2)/H*100,z=Math.max(1.2,Math.min(2.4,.6*W/BW,.6*H/BH));
  i.className="fz";i.innerHTML=`<b class="fbox" style="left:${L/W*100}%;top:${T/H*100}%;width:${BW/W*100}%;height:${BH/H*100}%"></b>`;
  i.style.transformOrigin=`${cx}% ${cy}%`;i.style.transform="scale(1)";setTimeout(()=>{i.style.transform=`scale(${z})`},60);return true;
}

// ---------- עריכה: חיתוך כל 2-3 שניות ----------
function cut(newSent){
  const el=cur.el,it=cur.it,ims=el.querySelectorAll(".img");
  if(newSent)showVis(el,it,it.chunks[el._ci||0].si);
  if(!ims.length)return;
  const ci=el._ci||0,si=it.chunks[ci].si,map=it.sent_img;
  let idx=map?map[si]:(newSent?(cur.k+1)%ims.length:cur.k);
  if(idx==null)idx=(cur.k!=null&&cur.k>=0)?cur.k:0; // אין תמונה ייעודית למשפט: נשארים על תמונת הנושא, לא מסך שחור
  if(idx==null){ // אין תמונה מתאימה: כרטיס עם המספר/אימוג'י במקום תמונה לא קשורה
    if(!el.classList.contains("noimg")||newSent){const w=it.tim.w,b=it.tim.b,e=si+1<b.length?b[si+1]:w.length;let txt=it.title;
      for(let j=b[si];j<e;j++)if(/\d/.test(w[j][0])){txt=w[j][0].replace(/[.,:]$/,"")+(j+1<e?`<small>${w[j+1][0].replace(/[.,:]$/,"")}</small>`:"");break}
      const st=el.querySelector(".stat");st.innerHTML=txt;el.classList.remove("noimg");void st.offsetWidth;el.classList.add("noimg");el.querySelector(".ic").textContent="";if(newSent)whoosh()}
    cur.k=null;cur.lastCut=player.currentTime;return}
  el.classList.remove("noimg");
  const cn=cur.cn=(cur.cn||0)+1,m=ims[idx],i=m.firstChild,change=idx!==cur.k;
  if(!newSent&&cur.focus)return;
  ims.forEach(x=>{const q=x.firstChild;q.innerHTML="";q.style.transform="";q.style.transformOrigin=""});
  if(change){ims.forEach(x=>{if(x!==m)x.classList.remove("on","e0","e1","e2","e3")});m.classList.remove("e0","e1","e2","e3")}
  i.className="";void m.offsetWidth;
  if(change){m.classList.add("on","e"+(cn%4));if(cn>1)whoosh()}
  cur.focus=newSent&&focusImg(el,it,si,m,i);if(!cur.focus)i.className="m"+((cn*5)%6);
  cur.k=idx;const im=it.images[idx];el.querySelector(".ic").textContent=im.artist||im.license?`${it.lang==="en"?"Photo":"צילום"}: ${im.artist}${im.artist&&im.license?", ":""}${im.license}`:"";
  cur.lastCut=player.currentTime;
}

// ---------- מוזיקה ואפקטים (נוצרים בדפדפן) ----------
let AC=null,master=null,NB=null,mus=null;
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function whoosh(){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type="bandpass";f.Q.value=1.5;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(5000,t+.22);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.06);g.gain.linearRampToValueAtTime(0,t+.3);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.35)}
const PROGS=[[0,-3,5,7],[0,5,-3,7],[0,7,-3,5],[-3,5,0,7]];
function note(m){return 440*Math.pow(2,(m-69)/12)}
function startMusic(seed){
  stopMusic();if(!AC)return;const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1100;
  g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(.055,AC.currentTime+.25);lp.connect(g);g.connect(master);
  const root=50+seed%5,prog=PROGS[seed%PROGS.length],beat=60/(92+seed%12);let next=AC.currentTime+.05,step=0;
  const sched=()=>{while(next<AC.currentTime+.6){const t=next,bar=Math.floor(step/8),ch=prog[bar%4];
      if(step%8===0)[0,4,7,12].forEach(x=>{const o=AC.createOscillator(),e=AC.createGain();o.type="triangle";o.frequency.value=note(root+ch+x);
        e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.18,t+.25);e.gain.linearRampToValueAtTime(0,t+beat*8);o.connect(e);e.connect(lp);o.start(t);o.stop(t+beat*8+.05)});
      if(step%2===0){const o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);
        e.gain.setValueAtTime(step%4===0?.9:.35,t);e.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(e);e.connect(g);o.start(t);o.stop(t+.2)}
      else{const b=AC.createBufferSource(),f=AC.createBiquadFilter(),e=AC.createGain();b.buffer=NB;f.type="highpass";f.frequency.value=7000;
        e.gain.setValueAtTime(.25,t);e.gain.exponentialRampToValueAtTime(.001,t+.05);b.connect(f);f.connect(e);e.connect(g);b.start(t,Math.random()*.5);b.stop(t+.06)}
      step++;next+=beat/2}};
  sched();mus={g,iv:setInterval(sched,150)};
}
function stopMusic(){if(!mus)return;clearInterval(mus.iv);const g=mus.g;try{g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(g.gain.value,AC.currentTime);g.gain.linearRampToValueAtTime(0,AC.currentTime+.3)}catch(e){}setTimeout(()=>g.disconnect(),400);mus=null}

// ---------- נגן ----------
// קריינות דרך Web Audio: מפוענחת מראש לסרטונים הבאים, ולכן מתחילה מיד בגלילה
const BUF={};
function loadBuf(id){if(!AC||!AUD[id])return null;if(!BUF[id])BUF[id]=fetch(AUD[id]).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>AC.decodeAudioData(b,res,rej))).catch(()=>{delete BUF[id];return null});return BUF[id]}
const player={buf:null,node:null,t0:0,off:0,playing:false,ver:0,muted:false,virt:null,
  get currentTime(){if(this.virt)return((performance.now()-this.virt.t0)/1000)%this.virt.dur;if(!this.buf)return 0;const t=this.playing?AC.currentTime-this.t0:this.off;return t%this.buf.duration},
  set currentTime(v){const was=this.playing;this._stop();this.off=Math.max(0,v);if(was)this.play()},
  get duration(){return this.virt?this.virt.dur:this.buf?this.buf.duration:0},
  play(){if(!AC||!this.buf||this.playing)return Promise.resolve();if(!this.gn){this.gn=AC.createGain();this.gn.connect(master)}
    const s=AC.createBufferSource();s.buffer=this.buf;s.loop=true;s.connect(this.gn);const o=this.off%this.buf.duration;s.start(0,o);this.t0=AC.currentTime-o;this.node=s;this.playing=true;return Promise.resolve()},
  pause(){if(this.playing){this.off=this.currentTime;this._stop()}},
  _stop(){if(this.node){try{this.node.stop()}catch(e){}this.node.disconnect();this.node=null}this.playing=false},
  async open(id,from=0){this._stop();this.off=from;this.buf=null;const my=++this.ver,p=loadBuf(id),b=p&&await p;if(my!==this.ver||!b)return;this.buf=b;if(cur&&!cur.paused)this.play()}};
let cur=null,muted=false;
function activate(el){
  if(cur&&cur.el===el)return;leave();
  const it=el._it;cur={el,it,enter:performance.now(),lastT:0,done:false};
  const i=[...feed.children].indexOf(el);ensure(i+4);
  if(it.quiz){player.pause();return}
  if(!AC){const w=it.tim.w;player.virt={t0:performance.now(),dur:(w.length?w[w.length-1][2]:20)+.3}} // לפני הנגיעה הראשונה: רץ בלי קול
  else{const go=()=>{if(master){master.gain.cancelScheduledValues(AC.currentTime);master.gain.setValueAtTime(muted?0:1,AC.currentTime)}};if(AC.state!=="running")AC.resume().then(go);go()} // אחרי השהייה בסרטון הקודם: מחזירים את הקול
  seenRefs.add(it.id);cur.k=-1;cur.cn=0;cut(true);cur.lastCut=0;
  const tt=el.querySelector(".ttl");if(tt){tt.classList.add("big");clearTimeout(tt._t);tt._t=setTimeout(()=>tt.classList.remove("big"),1400)}
  let h=0;for(const ch of it.id)h=(h*31+ch.charCodeAt(0))>>>0;startMusic(h);
  player._stop();setTimeout(()=>{if(cur&&cur.it===it)player.open(it.id)},300); // רגע קטן אחרי הגלילה, כדי שהמילה הראשונה לא תיבלע
  const kids=[...feed.children],keep=new Set(kids.slice(Math.max(0,i-1),i+4).map(e=>e._it.id));
  kids.slice(i+1,i+4).forEach(e=>{if(!e._it.quiz)loadBuf(e._it.id)});for(const k in BUF)if(!keep.has(k))delete BUF[k];
}
function leave(){
  if(!cur)return;player.pause();stopMusic();
  if(!cur.it.quiz){const dt=performance.now()-cur.enter;if(cur.done)bump(cur.it.cat,.5);else if(dt<2500)bump(cur.it.cat,-.3);
    cur.el.classList.remove("paused");showChunk(cur.el,cur.it,0)}
  cur=null;
}
function seekSlide(d){
  const it=cur.it,b=it.tim.b,w=it.tim.w,t=player.currentTime;
  let si=b.length-1;while(si>0&&w[b[si]][1]>t+.05)si--;
  if(d>0)si=(si+1)%b.length;else if(t-w[b[si]][1]<1)si=Math.max(0,si-1);
  player.currentTime=Math.max(0,w[b[si]][1]-.05);
  if(cur.paused)togglePause();
}
function togglePause(){cur.paused=!cur.paused;cur.el.classList.toggle("paused",cur.paused);
  // דעיכה קצרה במקום חיתוך חד, שגורם ל"קליק" בהשהייה
  if(cur.paused){if(AC&&master){const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+.08);
      setTimeout(()=>{if(cur&&cur.paused)player.pause()},100)}else player.pause();return} // בלי להקפיא את מנוע הסאונד: רק משתיקים
  if(AC){AC.resume();const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(muted?0:1,t+.1)}
  if(cur.it.quiz)return;
  if(!player.buf)player.open(cur.it.id);else player.play();
  if(!mus){let h=0;for(const ch of cur.it.id)h=(h*31+ch.charCodeAt(0))>>>0;startMusic(h)}}
function tick(){
  if(cur&&!cur.it.quiz){
    const it=cur.it,t=player.currentTime,d=player.duration||1;
    if(t<cur.lastT-1)cur.done=true;cur.lastT=t;
    cur.el.querySelector(".prog i").style.width=(t/d*100)+"%";
    let ci=it.chunks.length-1;while(ci>0&&it.chunks[ci].s>t+.08)ci--;
    if(ci!==cur.el._ci){const nsi=it.chunks[ci].si!==(it.chunks[cur.el._ci]||{}).si;showChunk(cur.el,it,ci);if(nsi||t<cur.lastCut)cut(true);else if(t-cur.lastCut>=2.4)cut(false)}
    cur.el.querySelectorAll(".cap span").forEach(s=>{const x=it.tim.w[+s.dataset.j];s.classList.toggle("on",t+.05>=x[1]&&t<x[2]+.15)});
  }
  requestAnimationFrame(tick);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)activate(e.target)}),{threshold:.6});

// ---------- ממשק ----------
const ICON={snd:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg>',mute:'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'};
const $=id=>document.getElementById(id);let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
// התחלה אוטומטית בשתי השפות. הדפדפן מתיר קול רק אחרי נגיעה ראשונה
LANGS=["he","en"];player.muted=true;loadFeed().then(()=>ensure(3));requestAnimationFrame(tick);
setInterval(()=>{if(!document.hidden)loadFeed().then(()=>{if(cur)ensure([...feed.children].indexOf(cur.el)+4)})},180000); // סרטונים חדשים נכנסים לשרשרת בלי עדכון
const unlock=e=>{document.removeEventListener("click",unlock,true);e.stopPropagation();e.preventDefault(); // הנגיעה הראשונה רק מפעילה קול
  const u=$("unmute");if(u)u.remove();initAudio();if(AC)AC.resume();
  if(cur&&!cur.it.quiz){player.virt=null;player.open(cur.it.id,0);cur.lastT=0;cur.k=-1;cur.cn=0;cut(true);const tt=cur.el.querySelector(".ttl");if(tt){tt.classList.add("big");setTimeout(()=>tt.classList.remove("big"),1400)}let h=0;for(const ch of cur.it.id)h=(h*31+ch.charCodeAt(0))>>>0;startMusic(h)}
  player.virt=null;[...feed.children].slice(0,4).forEach(x=>{if(!x._it.quiz)loadBuf(x._it.id)})};
document.addEventListener("click",unlock,true);
// יציאה מהאפליקציה / מסך נעול: עוצרים הכול, וממשיכים כשחוזרים
// המסך לא נכבה בזמן צפייה (Wake Lock). בהשהייה משחררים, כדי שהטלפון יוכל להיכבות כרגיל
let wake=null;
async function keepAwake(on){try{if(on){if(!wake&&"wakeLock" in navigator&&!document.hidden){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}else if(wake){await wake.release();wake=null}}catch(e){}}
setInterval(()=>keepAwake(!!(AC&&cur&&!cur.paused&&!document.hidden)),2000);
function fadeTo(v,d){if(!AC||!master)return;const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(v,t+d)}
window.addEventListener("blur",()=>fadeTo(0,.04));
window.addEventListener("focus",()=>{if(cur&&!cur.paused&&!document.hidden)fadeTo(muted?0:1,.12)});
function bgPause(){if(!AC){player.pause();return}const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(master.gain.value,t);master.gain.linearRampToValueAtTime(0,t+.03);
  setTimeout(()=>{player.pause();AC.suspend()},60)} // דעיכה לפני עצירה, בלי קליק
document.addEventListener("visibilitychange",()=>{if(document.hidden)bgPause();else{loadFeed()}if(!document.hidden&&cur&&!cur.paused&&!cur.it.quiz){if(AC)AC.resume().then(()=>{const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setValueAtTime(0,t);master.gain.linearRampToValueAtTime(muted?0:1,t+.12)});player.play().catch(()=>{})}});
window.addEventListener("pagehide",bgPause);window.addEventListener("blur",()=>{if(document.hidden)bgPause()});
$("btnSound").onclick=()=>{muted=!muted;player.muted=muted;if(master)master.gain.value=muted?0:1;$("btnSound").innerHTML=muted?ICON.mute:ICON.snd};
$("btnStats").onclick=()=>{
  const max=Math.max(...Object.keys(CATS).map(w));
  $("rows").innerHTML=Object.keys(CATS).sort((a,b)=>w(b)-w(a)).map(c=>`<div class="row"><span>${lab(c,"he")}</span><div class="bar"><i style="width:${w(c)/max*100}%"></i></div><b>${w(c).toFixed(1)}</b></div>`).join("");
  $("panel").classList.add("on");if(cur&&!cur.paused&&!cur.it.quiz)togglePause();
};
$("closePanel").onclick=()=>$("panel").classList.remove("on");
document.addEventListener("keydown",e=>{if(!cur||cur.it.quiz)return;
  if(e.key==="ArrowLeft")seekSlide(1);else if(e.key==="ArrowRight")seekSlide(-1);else if(e.key===" "){e.preventDefault();togglePause()}});
</script>
