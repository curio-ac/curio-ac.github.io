<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curio</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Heebo,system-ui,sans-serif;overflow:hidden}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;max-width:520px;margin:0 auto;user-select:none}
.bg{position:absolute;inset:-10%;background:linear-gradient(160deg,var(--c1),var(--c2));transition:filter .5s}
.bigemo{position:absolute;font-size:70vmin;opacity:.12;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);pointer-events:none;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:translate(-46%,-54%) rotate(-4deg) scale(1.2)}}
.emo{position:absolute;top:20%;left:0;right:0;text-align:center;font-size:84px;z-index:2;pointer-events:none}
.emo.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-15deg);opacity:0}}
.cap{position:absolute;top:38%;left:70px;right:20px;min-height:30%;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px 10px;text-align:center;z-index:2;pointer-events:none}
.cap.pop{animation:cpop .22s ease-out}
@keyframes cpop{from{transform:scale(.82);opacity:.3}}
.cap span{font-size:clamp(32px,9.5vw,46px);font-weight:900;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35);transition:color .1s,transform .12s;display:inline-block}
.cap span.on{color:#ffd166;transform:scale(1.1)}
.cap span.num{color:#7cf3ff}
.cap span.num.on{color:#ffd166}
.prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:4}
.prog i{display:block;height:100%;width:0;background:#fff}
.meta{position:absolute;bottom:22px;right:16px;left:78px;z-index:3}
.chip{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:4px 12px;border-radius:99px;font-size:13px;margin-bottom:8px}
.meta h2{font-size:18px;font-weight:900;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.meta a{color:#fff;opacity:.85;font-size:13px}
.actions{position:absolute;left:8px;bottom:96px;display:flex;flex-direction:column;gap:16px;z-index:3}
.actions button{background:none;border:0;color:#fff;font-size:30px;display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));transition:transform .2s;width:54px}
.actions small{font-size:11px;font-family:inherit;margin-top:2px;font-weight:700}
.actions button.on{transform:scale(1.18)}
.pz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:84px;z-index:5;pointer-events:none;opacity:.85}
.post.paused .pz{display:flex}
#top{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10;max-width:520px;margin:0 auto;background:linear-gradient(rgba(0,0,0,.4),transparent)}
.logo{font-weight:900;font-size:25px;letter-spacing:-.5px;direction:ltr}
.logo b{color:#ffd166}
#top button{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:17px;width:38px;height:38px;border-radius:50%;margin-right:8px;cursor:pointer}
.quiz{position:absolute;inset:96px 22px 110px;display:flex;flex-direction:column;justify-content:center;gap:12px;z-index:3}
.quiz .tag{text-align:center;font-size:15px;opacity:.85}
.quiz h3{font-size:clamp(22px,6.4vw,30px);font-weight:900;text-align:center;margin-bottom:10px;line-height:1.3}
.quiz button{font:inherit;font-size:18px;font-weight:700;padding:14px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:background .25s}
.quiz button.ok{background:#06d6a0;border-color:#06d6a0}
.quiz button.bad{background:#ef476f;border-color:#ef476f}
.quiz .x{font-size:17px;text-align:center;opacity:0;transition:opacity .3s;line-height:1.4;margin-top:6px}
.quiz .x.on{opacity:1}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#start{background:radial-gradient(circle at 30% 20%,#7b2ff7,#1a0b3d 60%,#000)}
#start .logo{font-size:64px;margin-bottom:6px}
#start p{font-size:20px;opacity:.9;margin-bottom:34px}
#start button{font:inherit;font-size:19px;font-weight:700;border:0;border-radius:99px;padding:14px 34px;cursor:pointer;width:240px;background:#ffd166;color:#1a0b3d}
#start small{margin-top:26px;opacity:.6;font-size:13px;line-height:1.6}
#panel{background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:none}
#panel.on{display:flex}
#panel .box{width:100%;max-width:400px;text-align:right}
#panel h3{font-size:22px;margin-bottom:4px}
#panel .sub{opacity:.7;font-size:14px;margin-bottom:18px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.row span{width:84px}
.row .bar{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.row .bar i{display:block;height:100%;background:#ffd166;border-radius:5px}
#panel button{font:inherit;margin-top:20px;background:#fff;color:#000;border:0;border-radius:99px;padding:10px 24px;font-weight:700;cursor:pointer}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.92);padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="top"><div class="logo">curi<b>o</b></div><div><button id="btnStats" title="האלגוריתם">📊</button><button id="btnSound" title="קול">🔊</button></div></div>
<div id="feed"></div>
<div id="start" class="ov">
  <div class="logo">curi<b>o</b></div>
  <p>לגלול. ללמוד. להתפלא.</p>
  <button id="go">התחל 🔊</button>
  <small>גלילה למעלה = נושא הבא · נגיעה בצד שמאל/ימין = קדימה/אחורה · נגיעה במרכז = עצירה</small>
</div>
<div id="panel" class="ov"><div class="box"><h3>📊 מה האלגוריתם למד עליך</h3><div class="sub">לייק, שמירה וצפייה עד הסוף מגדילים משקל. דילוג מהיר מקטין.</div><div id="rows"></div><button id="closePanel">סגור</button></div></div>
<div id="toast"></div>
<script>
/*DATA*/
const CATS={
 "חלל":["#1b1464","#05010f"],"ביולוגיה":["#0b6e4f","#08251c"],"היסטוריה":["#9c4f1c","#2b1206"],
 "מתמטיקה":["#3a0ca3","#10002b"],"גאוגרפיה":["#0077b6","#03045e"],"פיזיקה":["#c9184a","#3d0814"],
 "כימיה":["#e09f3e","#4a2c06"],"שפה":["#5f0f40","#1a0412"],"פסיכולוגיה":["#7209b7","#22033a"],
 "אמנות":["#bc6c25","#283618"],"כלכלה":["#2a9d8f","#0b2d29"]
};
const Q=[
{id:"q1",ref:"lt",cat:"פיזיקה",q:"איך מעריכים כמה רחוק הברק?",o:["סופרים שניות עד הרעם ומחלקים ב־3","סופרים שניות ומכפילים ב־10","לפי עוצמת ההבזק","אי אפשר לדעת"],a:0,x:"הקול עובר כקילומטר בכל 3 שניות, והאור מגיע כמעט מיד."},
{id:"q2",ref:"oc",cat:"ביולוגיה",q:"כמה לבבות יש לתמנון?",o:["אחד","שניים","שלושה","שמונה"],a:2,x:"שניים לזימים ואחד לשאר הגוף."},
{id:"q3",ref:"bd",cat:"מתמטיקה",q:"כמה אנשים צריך כדי שהסיכוי ליום הולדת משותף יעלה על 50%?",o:["23","100","183","365"],a:0,x:"ב־23 אנשים יש 253 זוגות, וזה מספיק."},
{id:"q4",ref:"mt",cat:"גאוגרפיה",q:"מה עומקה של הנקודה העמוקה באוקיינוס?",o:["כ־3 ק״מ","כ־11 ק״מ","כ־25 ק״מ","כ־100 ק״מ"],a:1,x:"תהום צ'לנג'ר עמוקה כמעט 11 ק״מ, יותר מגובה האוורסט."},
{id:"q5",ref:"rs",cat:"היסטוריה",q:"מה אפשר את פענוח ההירוגליפים?",o:["מגילות ים המלח","אבן רוזטה","הפירמידה הגדולה","ספר המתים"],a:1,x:"אותו טקסט הופיע עליה גם ביוונית עתיקה."}
];

// ---------- הכנת כתוביות: חלוקה לקבוצות של עד 3 מילים ----------
for(const v of V){
  const {w,b}=v.tim;v.chunks=[];
  b.forEach((st,si)=>{const en=si+1<b.length?b[si+1]:w.length;let c=null;
    for(let k=st;k<en;k++){if(!c){c={s:w[k][1],si,ws:[]};v.chunks.push(c)}c.ws.push(k);
      const len=c.ws.reduce((a,j)=>a+w[j][0].length,0);
      if(c.ws.length>=3||/[.,:?!]$/.test(w[k][0])||len>13)c=null}});
}

// ---------- אחסון מקומי ----------
let st={};try{st=JSON.parse(localStorage.getItem("curio")||"{}")}catch(e){}
const W=st.w||{},liked=new Set(st.l||[]),saved=new Set(st.s||[]);
const save=()=>{try{localStorage.setItem("curio",JSON.stringify({w:W,l:[...liked],s:[...saved]}))}catch(e){}};
const w=c=>W[c]??1;
const bump=(c,d)=>{W[c]=Math.round(Math.max(.2,Math.min(10,w(c)+d))*100)/100;save()};

// ---------- האלגוריתם ----------
const used=new Set(),quizDone=new Set(),seenRefs=new Set();let sinceQuiz=0;
function pick(){
  if(sinceQuiz>=4){const q=Q.find(q=>!quizDone.has(q.id)&&seenRefs.has(q.ref));if(q){quizDone.add(q.id);sinceQuiz=0;return{quiz:q,cat:q.cat}}}
  let pool=V.filter(x=>!used.has(x.id));
  if(!pool.length){used.clear();toast("🔁 סבב חדש");pool=V.slice()}
  let r=Math.random()*pool.reduce((a,x)=>a+w(x.cat),0);
  for(const x of pool){r-=w(x.cat);if(r<=0){used.add(x.id);sinceQuiz++;return x}}
  used.add(pool[0].id);return pool[0];
}

// ---------- רינדור ----------
const feed=document.getElementById("feed");
function render(it){
  const el=document.createElement("section");el.className="post";el._it=it;
  const [c1,c2]=CATS[it.cat]||["#333","#000"];el.style.setProperty("--c1",c1);el.style.setProperty("--c2",c2);
  if(it.quiz){
    const q=it.quiz;
    el.innerHTML=`<div class="bg"></div><div class="bigemo">❓</div><div class="quiz"><div class="tag">🧠 בדיקה קטנה · ${q.cat}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}<div class="x">${q.x}<br><small>גללו להמשך ↑</small></div></div>`;
    el.querySelectorAll(".quiz button").forEach(b=>b.onclick=()=>{
      if(el._ans)return;el._ans=1;const ok=+b.dataset.i===q.a;
      b.classList.add(ok?"ok":"bad");el.querySelector(`[data-i="${q.a}"]`).classList.add("ok");
      el.querySelector(".x").classList.add("on");bump(q.cat,ok?.3:.8);
    });
    return el;
  }
  el.innerHTML=`<div class="bg"></div><div class="bigemo">${it.emoji}</div><div class="emo">${it.emoji}</div><div class="cap"></div><div class="pz">⏸</div>
  <div class="actions">
    <button class="like${liked.has(it.id)?" on":""}">${liked.has(it.id)?"❤️":"🤍"}<small>אהבתי</small></button>
    <button class="sv${saved.has(it.id)?" on":""}">${saved.has(it.id)?"⭐":"☆"}<small>שמירה</small></button>
    <button class="sh">🔗<small>שיתוף</small></button>
  </div>
  <div class="meta"><span class="chip">${it.cat}</span><h2>${it.title}</h2><a href="${it.source}" target="_blank" rel="noopener">📖 מקור: ויקיפדיה ↗</a></div><div class="prog"><i></i></div>`;
  showChunk(el,it,0);
  const lk=el.querySelector(".like"),sv=el.querySelector(".sv");
  lk.onclick=()=>{const on=!liked.has(it.id);on?liked.add(it.id):liked.delete(it.id);bump(it.cat,on?2:-2);lk.classList.toggle("on",on);lk.firstChild.textContent=on?"❤️":"🤍"};
  sv.onclick=()=>{const on=!saved.has(it.id);on?saved.add(it.id):saved.delete(it.id);bump(it.cat,on?1.5:-1.5);sv.classList.toggle("on",on);sv.firstChild.textContent=on?"⭐":"☆";toast(on?"נשמר ⭐":"הוסר מהשמורים")};
  el.querySelector(".sh").onclick=()=>{const txt=`${it.title} | Curio\n${it.source}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("הקישור הועתק 🔗"),()=>toast("לא ניתן להעתיק כאן"))};
  el.addEventListener("click",e=>{
    if(e.target.closest("button,a")||!cur||cur.el!==el)return;
    const x=(e.clientX-el.getBoundingClientRect().left)/el.offsetWidth;
    if(x<.3)seekSlide(1);else if(x>.7)seekSlide(-1);else togglePause();
  });
  return el;
}
function showChunk(el,it,ci){
  const c=it.chunks[ci],cap=el.querySelector(".cap"),w=it.tim.w;
  cap.innerHTML=c.ws.map(j=>`<span data-j="${j}"${/\d/.test(w[j][0])?' class="num"':""}>${w[j][0]}</span>`).join("");
  cap.classList.remove("pop");void cap.offsetWidth;cap.classList.add("pop");
  if(el._si!==c.si){el._si=c.si;const e=el.querySelector(".emo");e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");
    el.querySelector(".bg").style.filter=`hue-rotate(${c.si*18}deg) brightness(${1-c.si*.04})`}
  el._ci=ci;
}
function add(){const el=render(pick());feed.appendChild(el);io.observe(el)}

// ---------- נגן ----------
const player=new Audio();player.loop=true;let cur=null,muted=false;
function activate(el){
  if(cur&&cur.el===el)return;leave();
  const it=el._it;cur={el,it,enter:performance.now(),lastT:0,done:false};
  const i=[...feed.children].indexOf(el);while(feed.children.length<i+4)add();
  if(it.quiz){player.pause();return}
  seenRefs.add(it.id);
  player.src=AUD[it.id];player.currentTime=0;player.play().catch(()=>{});
}
function leave(){
  if(!cur)return;player.pause();
  if(!cur.it.quiz){const dt=performance.now()-cur.enter;if(cur.done)bump(cur.it.cat,.5);else if(dt<2500)bump(cur.it.cat,-.3);
    cur.el.classList.remove("paused");showChunk(cur.el,cur.it,0)}
  cur=null;
}
function seekSlide(d){
  const it=cur.it,b=it.tim.b,w=it.tim.w,t=player.currentTime;
  let si=b.length-1;while(si>0&&w[b[si]][1]>t+.05)si--;
  if(d>0)si=(si+1)%b.length;else if(t-w[b[si]][1]<1)si=Math.max(0,si-1);
  player.currentTime=Math.max(0,w[b[si]][1]-.05);
  if(cur.paused)togglePause();
}
function togglePause(){cur.paused=!cur.paused;cur.el.classList.toggle("paused",cur.paused);cur.paused?player.pause():player.play().catch(()=>{})}
function tick(){
  if(cur&&!cur.it.quiz){
    const it=cur.it,t=player.currentTime,d=player.duration||1;
    if(t<cur.lastT-1)cur.done=true;cur.lastT=t;
    cur.el.querySelector(".prog i").style.width=(t/d*100)+"%";
    let ci=it.chunks.length-1;while(ci>0&&it.chunks[ci].s>t+.08)ci--;
    if(ci!==cur.el._ci)showChunk(cur.el,it,ci);
    cur.el.querySelectorAll(".cap span").forEach(s=>{const x=it.tim.w[+s.dataset.j];s.classList.toggle("on",t+.05>=x[1]&&t<x[2]+.15)});
  }
  requestAnimationFrame(tick);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)activate(e.target)}),{threshold:.6});

// ---------- ממשק ----------
const $=id=>document.getElementById(id);let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
$("go").onclick=()=>{$("start").remove();for(let i=0;i<3;i++)add();requestAnimationFrame(tick)};
$("btnSound").onclick=()=>{muted=!muted;player.muted=muted;$("btnSound").textContent=muted?"🔇":"🔊"};
$("btnStats").onclick=()=>{
  const max=Math.max(...Object.keys(CATS).map(w));
  $("rows").innerHTML=Object.keys(CATS).sort((a,b)=>w(b)-w(a)).map(c=>`<div class="row"><span>${c}</span><div class="bar"><i style="width:${w(c)/max*100}%"></i></div><b>${w(c).toFixed(1)}</b></div>`).join("");
  $("panel").classList.add("on");if(cur&&!cur.paused&&!cur.it.quiz)togglePause();
};
$("closePanel").onclick=()=>$("panel").classList.remove("on");
document.addEventListener("keydown",e=>{if(!cur||cur.it.quiz)return;
  if(e.key==="ArrowLeft")seekSlide(1);else if(e.key==="ArrowRight")seekSlide(-1);else if(e.key===" "){e.preventDefault();togglePause()}});
</script>
</body>
</html>
