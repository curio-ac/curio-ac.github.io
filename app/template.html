<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Curio</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1a0b3d"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;font-family:Heebo,system-ui,sans-serif;overflow:hidden}
#feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#feed::-webkit-scrollbar{display:none}
.post{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;max-width:520px;margin:0 auto;user-select:none}
.bg{position:absolute;inset:-10%;background:linear-gradient(160deg,var(--c1),var(--c2));transition:filter .5s}
.bigemo{position:absolute;font-size:70vmin;opacity:.12;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);pointer-events:none;animation:kb 14s ease-in-out infinite alternate}
@keyframes kb{to{transform:translate(-46%,-54%) rotate(-4deg) scale(1.2)}}
.img{position:absolute;inset:0;opacity:0;transition:opacity .35s;overflow:hidden}
.img i{position:absolute;inset:0;background-size:cover;background-position:center}
.img.on{opacity:1;z-index:1}
.img.e0{animation:e0 .38s ease-out}.img.e1{animation:e1 .32s cubic-bezier(.2,.8,.2,1)}.img.e2{animation:e2 .4s ease-out}.img.e3{animation:e3 .35s ease-out}
@keyframes e0{from{transform:scale(1.3);filter:blur(10px)}}
@keyframes e1{from{transform:translateX(40%)}}
@keyframes e2{from{filter:brightness(2.5) saturate(0)}}
@keyframes e3{from{transform:scale(.8) rotate(-3deg);filter:blur(6px)}}
.img i.m0{animation:m0 3.6s ease-out forwards}.img i.m1{animation:m1 3.6s ease-out forwards}.img i.m2{animation:m2 3.6s linear forwards}
.img i.m3{animation:m3 3.6s linear forwards}.img i.m4{animation:m4 3.6s ease-out forwards}.img i.m5{animation:m5 3.6s ease-out forwards}
@keyframes m0{from{transform:scale(1.05)}to{transform:scale(1.32)}}
@keyframes m1{from{transform:scale(1.35)}to{transform:scale(1.08)}}
@keyframes m2{from{transform:scale(1.28) translateX(6%)}to{transform:scale(1.28) translateX(-6%)}}
@keyframes m3{from{transform:scale(1.28) translateX(-6%)}to{transform:scale(1.28) translateX(6%)}}
@keyframes m4{from{transform:scale(1.25) translateY(5%)}to{transform:scale(1.3) translateY(-5%)}}
@keyframes m5{from{transform:scale(1.1) translate(-4%,4%)}to{transform:scale(1.32) translate(4%,-4%)}}
.shade{position:absolute;inset:0;z-index:2;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.1) 35%,rgba(0,0,0,.25) 60%,rgba(0,0,0,.75));z-index:1}
.has-img .bigemo{display:none}
.stat{position:absolute;top:13%;left:0;right:0;text-align:center;font-size:clamp(70px,22vw,110px);font-weight:900;color:#ffd166;z-index:3;display:none;text-shadow:0 6px 30px rgba(0,0,0,.4);line-height:1.1}
.stat small{display:block;font-size:.32em;color:#fff}
.noimg .stat{display:block;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.noimg .img{opacity:0!important}.noimg .emo{display:none}.has-img.noimg .bigemo{display:block}
.credit{font-size:10.5px;opacity:.65;margin-top:5px;line-height:1.4}
.post[dir=ltr] .actions{left:auto;right:8px}
.post[dir=ltr] .meta{left:16px;right:78px}
.post[dir=ltr] .cap{left:20px;right:70px}
.vis{position:absolute;top:11%;left:16px;right:16px;height:46%;z-index:3;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.vis.on{display:flex;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.withvis .shade{background:rgba(0,0,0,.55)}.withvis .emo{display:none}
.v-num{font-size:clamp(64px,20vw,104px);font-weight:900;color:#ffd166;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.v-num small{font-size:.4em;color:#fff;margin:0 6px}
.v-lab{font-size:20px;font-weight:700;opacity:.9;margin-top:8px}
.v-ic{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:clamp(34px,10vw,48px);max-width:100%;direction:ltr}
.v-ic span{display:inline-block;overflow:hidden;animation:pop .35s both}
.v-map{width:100%;max-height:100%;border-radius:18px;background:rgba(0,40,80,.35)}
.v-map g{transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
.v-map .pin{fill:#ffd166;stroke:#fff;stroke-width:.6}.v-map .ring{fill:none;stroke:#ffd166;stroke-width:.8;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{r:1;opacity:1}to{r:9;opacity:0}}
.v-tl{width:92%;position:relative;height:90px;margin-top:10px;direction:ltr}
.v-tl .ax{position:absolute;top:44px;left:0;right:0;height:4px;background:rgba(255,255,255,.35);border-radius:2px}
.v-tl .dot{position:absolute;top:34px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#ffd166;box-shadow:0 0 18px #ffd166;transition:left 1.3s cubic-bezier(.6,0,.2,1)}
.v-tl .end{position:absolute;top:62px;font-size:15px;opacity:.8}
.fbox{position:absolute;border:3px solid #ffd166;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.35),0 0 20px #ffd166;animation:pop .5s .5s both}
.img i.fz{animation:none!important;transition:transform 1.3s cubic-bezier(.6,0,.2,1)}
#start .langs{display:flex;flex-direction:column;gap:10px}
#start .langs button.alt{background:rgba(255,255,255,.15);color:#fff}
.emo{position:absolute;top:20%;left:0;right:0;text-align:center;font-size:84px;z-index:3;pointer-events:none}
.emo.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4) rotate(-15deg);opacity:0}}
.cap{position:absolute;top:60%;left:70px;right:20px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:4px 10px;text-align:center;z-index:3;pointer-events:none}
.cap.pop{animation:cpop .22s ease-out}
@keyframes cpop{from{transform:scale(.82);opacity:.3}}
.cap span{font-size:clamp(21px,6vw,27px);font-weight:900;line-height:1.15;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35);transition:color .1s,transform .12s;display:inline-block}
.cap span.on{color:#ffd166;transform:scale(1.1)}
.cap span.num{color:#7cf3ff}
.cap span.num.on{color:#ffd166;transform:scale(1.2);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.prog{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:4}
.prog i{display:block;height:100%;width:0;background:#fff}
.meta{position:absolute;bottom:22px;right:16px;left:78px;z-index:3}
.chip{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);padding:4px 12px;border-radius:99px;font-size:13px;margin-bottom:8px}
.meta h2{font-size:15px;font-weight:900;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.meta a{color:#fff;opacity:.85;font-size:13px}
.actions{position:absolute;left:8px;bottom:96px;display:flex;flex-direction:column;gap:16px;z-index:3}
.actions button{background:none;border:0;color:#fff;font-size:30px;display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));transition:transform .2s;width:54px}
.actions small{font-size:11px;font-family:inherit;margin-top:2px;font-weight:700}
.actions button.on{transform:scale(1.18)}
.pz{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:84px;z-index:5;pointer-events:none;opacity:.85}
.post.paused .pz{display:flex}
#top{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:10;max-width:520px;margin:0 auto;background:linear-gradient(rgba(0,0,0,.4),transparent)}
.logo{font-weight:900;font-size:25px;letter-spacing:-.5px;direction:ltr}
.logo b{color:#ffd166}
#top button{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:17px;width:38px;height:38px;border-radius:50%;margin-right:8px;cursor:pointer}
.quiz{position:absolute;inset:96px 22px 110px;display:flex;flex-direction:column;justify-content:center;gap:12px;z-index:3}
.quiz .tag{text-align:center;font-size:15px;opacity:.85}
.quiz h3{font-size:clamp(22px,6.4vw,30px);font-weight:900;text-align:center;margin-bottom:10px;line-height:1.3}
.quiz button{font:inherit;font-size:18px;font-weight:700;padding:14px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;transition:background .25s}
.quiz button.ok{background:#06d6a0;border-color:#06d6a0}
.quiz button.bad{background:#ef476f;border-color:#ef476f}
.quiz .x{font-size:17px;text-align:center;opacity:0;transition:opacity .3s;line-height:1.4;margin-top:6px}
.quiz .x.on{opacity:1}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#start{background:radial-gradient(circle at 30% 20%,#7b2ff7,#1a0b3d 60%,#000)}
#start .logo{font-size:64px;margin-bottom:6px}
#start p{font-size:20px;opacity:.9;margin-bottom:34px}
#start button{font:inherit;font-size:34px;font-weight:900;border:0;border-radius:50%;width:96px;height:96px;cursor:pointer;background:#ffd166;color:#1a0b3d;padding-left:6px}
#start small{margin-top:26px;opacity:.6;font-size:13px;line-height:1.6}
#panel{background:rgba(0,0,0,.82);backdrop-filter:blur(8px);display:none}
#panel.on{display:flex}
#panel .box{width:100%;max-width:400px;text-align:right}
#panel h3{font-size:22px;margin-bottom:4px}
#panel .sub{opacity:.7;font-size:14px;margin-bottom:18px}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.row span{width:84px}
.row .bar{flex:1;height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden}
.row .bar i{display:block;height:100%;background:#ffd166;border-radius:5px}
#panel button{font:inherit;margin-top:20px;background:#fff;color:#000;border:0;border-radius:99px;padding:10px 24px;font-weight:700;cursor:pointer}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.92);padding:10px 18px;border-radius:99px;font-size:14px;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="top"><div class="logo">curi<b>o</b></div><div><button id="btnStats" title="האלגוריתם">📊</button><button id="btnSound" title="קול">🔊</button></div></div>
<div id="feed"></div>
<div id="start" class="ov" id2="tap"><div class="logo">curi<b>o</b></div><p>לגלול. ללמוד. להתפלא.</p><button id="go">▶</button></div>
<div id="panel" class="ov"><div class="box"><h3>📊 מה האלגוריתם למד עליך</h3><div class="sub">לייק, שמירה וצפייה עד הסוף מגדילים משקל. דילוג מהיר מקטין.</div><div id="rows"></div><button id="closePanel">סגור</button></div></div>
<div id="toast"></div>
<script>
/*DATA*/
/*WORLD*/
const CATS={space:["#1b1464","#05010f","חלל","Space"],biology:["#0b6e4f","#08251c","ביולוגיה","Biology"],history:["#9c4f1c","#2b1206","היסטוריה","History"],
 math:["#3a0ca3","#10002b","מתמטיקה","Math"],geography:["#0077b6","#03045e","גאוגרפיה","Geography"],physics:["#c9184a","#3d0814","פיזיקה","Physics"],
 chemistry:["#e09f3e","#4a2c06","כימיה","Chemistry"],language:["#5f0f40","#1a0412","שפה","Language"],psychology:["#7209b7","#22033a","פסיכולוגיה","Psychology"],
 art:["#bc6c25","#283618","אמנות","Art"],economics:["#2a9d8f","#0b2d29","כלכלה","Economics"],technology:["#3a86ff","#03113a","טכנולוגיה","Technology"],medicine:["#e63946","#3a0a0f","רפואה","Medicine"]};
const lab=(c,l)=>(CATS[c]||[])[l==="en"?3:2]||c;
const Q=[];let LANGS=["he"];

// ---------- הכנת כתוביות: חלוקה לקבוצות של עד 3 מילים ----------
for(const v of V){
  const {w,b}=v.tim;v.chunks=[];
  b.forEach((st,si)=>{const en=si+1<b.length?b[si+1]:w.length;let c=null;
    for(let k=st;k<en;k++){if(!c){c={s:w[k][1],si,ws:[]};v.chunks.push(c)}c.ws.push(k);
      const len=c.ws.reduce((a,j)=>a+w[j][0].length,0);
      if(c.ws.length>=3||/[.,:?!]$/.test(w[k][0])||len>13)c=null}});
}

// ---------- אחסון מקומי ----------
let st={};try{st=JSON.parse(localStorage.getItem("curio")||"{}")}catch(e){}
const W=st.w||{},liked=new Set(st.l||[]),saved=new Set(st.s||[]);
const save=()=>{try{localStorage.setItem("curio",JSON.stringify({w:W,l:[...liked],s:[...saved]}))}catch(e){}};
const w=c=>W[c]??1;
const bump=(c,d)=>{W[c]=Math.round(Math.max(.2,Math.min(10,w(c)+d))*100)/100;save()};

// ---------- האלגוריתם ----------
const used=new Set(),quizDone=new Set(),seenRefs=new Set();let sinceQuiz=0;
function pick(){
  if(sinceQuiz>=4){const q=Q.find(q=>!quizDone.has(q.id)&&seenRefs.has(q.ref));if(q){quizDone.add(q.id);sinceQuiz=0;return{quiz:q,cat:q.cat}}}
  let pool=V.filter(x=>!used.has(x.id)&&LANGS.includes(x.lang));
  if(!pool.length){used.clear();toast("🔁");pool=V.filter(x=>LANGS.includes(x.lang))}
  let r=Math.random()*pool.reduce((a,x)=>a+w(x.cat),0);
  for(const x of pool){r-=w(x.cat);if(r<=0){used.add(x.id);sinceQuiz++;return x}}
  used.add(pool[0].id);return pool[0];
}

// ---------- רינדור ----------
const feed=document.getElementById("feed");
function render(it){
  const el=document.createElement("section");el.className="post";el._it=it;
  const [c1,c2]=CATS[it.cat]||["#333","#000"];el.dir=it.lang==="en"?"ltr":"rtl";el.style.setProperty("--c1",c1);el.style.setProperty("--c2",c2);
  if(it.quiz){
    const q=it.quiz;
    el.innerHTML=`<div class="bg"></div><div class="bigemo">❓</div><div class="quiz"><div class="tag">🧠 בדיקה קטנה · ${q.cat}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}<div class="x">${q.x}<br><small>גללו להמשך ↑</small></div></div>`;
    el.querySelectorAll(".quiz button").forEach(b=>b.onclick=()=>{
      if(el._ans)return;el._ans=1;const ok=+b.dataset.i===q.a;
      b.classList.add(ok?"ok":"bad");el.querySelector(`[data-i="${q.a}"]`).classList.add("ok");
      el.querySelector(".x").classList.add("on");bump(q.cat,ok?.3:.8);
    });
    return el;
  }
  const en=it.lang==="en",ims=it.images||[];if(ims.length)el.classList.add("has-img");
  el.innerHTML=`<div class="bg"></div><div class="bigemo">${it.emoji}</div>${ims.map(m=>`<div class="img"><i style="background-image:url('${(window.IMG&&IMG[m.url])||m.url}')"></i></div>`).join("")}<div class="shade"></div><div class="stat"></div><div class="vis"></div><div class="emo">${it.emoji}</div><div class="cap"></div><div class="pz">⏸</div>
  <div class="actions">
    <button class="like${liked.has(it.id)?" on":""}">${liked.has(it.id)?"❤️":"🤍"}<small>${en?"Like":"אהבתי"}</small></button>
    <button class="sv${saved.has(it.id)?" on":""}">${saved.has(it.id)?"⭐":"☆"}<small>${en?"Save":"שמירה"}</small></button>
    <button class="sh">🔗<small>${en?"Share":"שיתוף"}</small></button>
  </div>
  <div class="meta"><span class="chip">${lab(it.cat,it.lang)}</span><h2>${it.title}</h2><a href="${it.source.url}" target="_blank" rel="noopener">📖 ${en?"Source: Wikipedia":"מקור: ויקיפדיה"} ↗</a><div class="credit">🤖 ${en?"AI narration · fact-checked against source":"קריינות AI · נבדק מול המקור"}<br><span class="ic"></span></div></div><div class="prog"><i></i></div>`;
  showChunk(el,it,0);
  const lk=el.querySelector(".like"),sv=el.querySelector(".sv");
  lk.onclick=()=>{const on=!liked.has(it.id);on?liked.add(it.id):liked.delete(it.id);bump(it.cat,on?2:-2);lk.classList.toggle("on",on);lk.firstChild.textContent=on?"❤️":"🤍"};
  sv.onclick=()=>{const on=!saved.has(it.id);on?saved.add(it.id):saved.delete(it.id);bump(it.cat,on?1.5:-1.5);sv.classList.toggle("on",on);sv.firstChild.textContent=on?"⭐":"☆";toast(on?"נשמר ⭐":"הוסר מהשמורים")};
  el.querySelector(".sh").onclick=()=>{const txt=`${it.title} | Curio\n${it.source.url}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("הקישור הועתק 🔗"),()=>toast("לא ניתן להעתיק כאן"))};
  el.addEventListener("click",e=>{
    if(e.target.closest("button,a")||!cur||cur.el!==el)return;
    const x=(e.clientX-el.getBoundingClientRect().left)/el.offsetWidth;
    const L=el.dir==="ltr";if(L?x>.7:x<.3)seekSlide(1);else if(L?x<.3:x>.7)seekSlide(-1);else togglePause();
  });
  return el;
}
function showChunk(el,it,ci){
  const c=it.chunks[ci],cap=el.querySelector(".cap"),w=it.tim.w;
  cap.innerHTML=c.ws.map(j=>`<span data-j="${j}"${/\d/.test(w[j][0])?' class="num"':""}>${w[j][0]}</span>`).join("");
  cap.classList.remove("pop");void cap.offsetWidth;cap.classList.add("pop");
  if(el._si!==c.si){el._si=c.si;const e=el.querySelector(".emo");e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");
    el.querySelector(".bg").style.filter=`hue-rotate(${c.si*18}deg) brightness(${1-c.si*.04})`}
  el._ci=ci;
}
function add(){const it=pick(),el=render(it);feed.appendChild(el);io.observe(el)}

// ---------- שכבת מידע ויזואלית ----------
const REF={length:[["human",1.7,"🧍","בני אדם","people"],["bus",12,"🚌","אוטובוסים","buses"],["football_field",105,"🏟️","מגרשי כדורגל","football fields"],["eiffel_tower",330,"🗼","מגדלי אייפל","Eiffel Towers"]],
  mass:[["human",70,"🧍","בני אדם","people"],["car",1500,"🚗","מכוניות","cars"],["elephant",6000,"🐘","פילים","elephants"]]};
const fmt=(n,l)=>(+n).toLocaleString(l==="en"?"en-US":"he-IL",{maximumFractionDigits:1});
function countUp(node,to,l){const t0=performance.now();const f=()=>{const p=Math.min(1,(performance.now()-t0)/900),e=1-Math.pow(1-p,3);node.textContent=fmt(Number.isInteger(+to)?Math.round(to*e):to*e,l);if(p<1)requestAnimationFrame(f)};f()}
function showVis(el,it,si){
  const box=el.querySelector(".vis"),v=(it.vis||[])[si]||{type:"image"},en=it.lang==="en";box.className="vis";box.innerHTML="";el.classList.remove("withvis");
  if(v.type==="stat"){box.innerHTML=`<div class="v-num"><b></b><small>${v.unit||""}</small></div><div class="v-lab">${v.label||""}</div>`;countUp(box.querySelector("b"),v.value,it.lang)}
  else if(v.type==="compare"){const refs=REF[v.dim]||[];let r=refs.find(x=>v.value/x[1]<=12&&v.value/x[1]>=1.2)||refs[refs.length-1];if(!r)return;
    const n=v.value/r[1],full=Math.floor(n),part=n-full;let ic="";for(let i=0;i<Math.min(full,12);i++)ic+=`<span style="animation-delay:${i*.07}s">${r[2]}</span>`;
    if(part>.05&&full<12)ic+=`<span style="width:${part}em;animation-delay:${full*.07}s">${r[2]}</span>`;
    box.innerHTML=`<div class="v-num" style="font-size:clamp(44px,13vw,64px)">≈ ${fmt(n,it.lang)} <small>${en?r[4]:r[3]}</small></div><div class="v-ic">${ic}</div><div class="v-lab">${fmt(v.value,it.lang)} ${v.dim==="mass"?(en?"kg":"ק״ג"):(en?"m":"מ׳")}</div>`}
  else if(v.type==="map"&&it.geo&&window.WORLD){const x=it.geo[1]+180,y=90-it.geo[0];
    box.innerHTML=`<svg class="v-map" viewBox="0 0 360 180"><g><path d="${WORLD}" fill="rgba(255,255,255,.28)" stroke="rgba(255,255,255,.5)" stroke-width=".3"/><circle class="ring" cx="${x}" cy="${y}" r="3"/><circle class="pin" cx="${x}" cy="${y}" r="2.2"/></g></svg><div class="v-lab">📍 ${it.geo[0].toFixed(1)}°, ${it.geo[1].toFixed(1)}°</div>`;
    const g=box.querySelector("g");setTimeout(()=>{g.style.transform=`translate(180px,90px) scale(3.2) translate(${-x}px,${-y}px)`},350)}
  else if(v.type==="timeline"){const now=new Date().getFullYear(),ago=now-v.year,yr=v.year<0?`${-v.year} ${en?"BCE":"לפנה״ס"}`:v.year;
    box.innerHTML=`<div class="v-num">${yr}</div><div class="v-lab">${en?"≈ "+fmt(ago,"en")+" years ago":"לפני כ־"+fmt(ago,"he")+" שנה"}</div><div class="v-tl"><div class="ax"></div><div class="dot" style="left:100%"></div><span class="end" style="left:0">${yr}</span><span class="end" style="right:0">${en?"today":"היום"}</span></div>`;
    setTimeout(()=>{box.querySelector(".dot").style.left="4%"},300)}
  else return;
  box.classList.add("on");el.classList.add("withvis");
}
function focusImg(el,it,si,m,i){
  const v=(it.vis||[])[si]||{};if(v.type!=="focus"||!v.box)return false;const im=it.images[it.sent_img[si]];if(!im||!im.w)return false;
  const W=el.offsetWidth,H=el.offsetHeight,s=Math.max(W/im.w,H/im.h),dw=im.w*s,dh=im.h*s,ox=(W-dw)/2,oy=(H-dh)/2,[y0,x0,y1,x1]=v.box.map(z=>z/1000);
  const L=ox+x0*dw,T=oy+y0*dh,BW=(x1-x0)*dw,BH=(y1-y0)*dh,cx=(L+BW/2)/W*100,cy=(T+BH/2)/H*100,z=Math.max(1.2,Math.min(2.4,.6*W/BW,.6*H/BH));
  i.className="fz";i.innerHTML=`<b class="fbox" style="left:${L/W*100}%;top:${T/H*100}%;width:${BW/W*100}%;height:${BH/H*100}%"></b>`;
  i.style.transformOrigin=`${cx}% ${cy}%`;i.style.transform="scale(1)";setTimeout(()=>{i.style.transform=`scale(${z})`},60);return true;
}

// ---------- עריכה: חיתוך כל 2-3 שניות ----------
function cut(newSent){
  const el=cur.el,it=cur.it,ims=el.querySelectorAll(".img");
  if(newSent)showVis(el,it,it.chunks[el._ci||0].si);
  if(!ims.length)return;
  const ci=el._ci||0,si=it.chunks[ci].si,map=it.sent_img;
  const idx=map?map[si]:(newSent?(cur.k+1)%ims.length:cur.k);
  if(idx==null&&el.classList.contains("withvis")){ims.forEach(x=>x.classList.remove("on"));cur.k=null;cur.lastCut=player.currentTime;return}
  if(idx==null){ // אין תמונה מתאימה: כרטיס עם המספר/אימוג'י במקום תמונה לא קשורה
    if(!el.classList.contains("noimg")||newSent){const w=it.tim.w,b=it.tim.b,e=si+1<b.length?b[si+1]:w.length;let txt=it.emoji;
      for(let j=b[si];j<e;j++)if(/\d/.test(w[j][0])){txt=w[j][0].replace(/[.,:]$/,"")+(j+1<e?`<small>${w[j+1][0].replace(/[.,:]$/,"")}</small>`:"");break}
      const st=el.querySelector(".stat");st.innerHTML=txt;el.classList.remove("noimg");void st.offsetWidth;el.classList.add("noimg");el.querySelector(".ic").textContent="";if(newSent)whoosh()}
    cur.k=null;cur.lastCut=player.currentTime;return}
  el.classList.remove("noimg");
  const cn=cur.cn=(cur.cn||0)+1,m=ims[idx],i=m.firstChild,change=idx!==cur.k;
  if(!newSent&&cur.focus)return;
  ims.forEach(x=>{const q=x.firstChild;q.innerHTML="";q.style.transform="";q.style.transformOrigin=""});
  if(change){ims.forEach(x=>{if(x!==m)x.classList.remove("on","e0","e1","e2","e3")});m.classList.remove("e0","e1","e2","e3")}
  i.className="";void m.offsetWidth;
  if(change){m.classList.add("on","e"+(cn%4));if(cn>1)whoosh()}
  cur.focus=newSent&&focusImg(el,it,si,m,i);if(!cur.focus)i.className="m"+((cn*5)%6);
  cur.k=idx;const im=it.images[idx];el.querySelector(".ic").textContent=im.artist||im.license?`📷 ${im.artist?im.artist+" · ":""}${im.license}`:"";
  cur.lastCut=player.currentTime;
}

// ---------- מוזיקה ואפקטים (נוצרים בדפדפן) ----------
let AC=null,master=null,NB=null,mus=null;
function initAudio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
function whoosh(){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type="bandpass";f.Q.value=1.5;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(5000,t+.22);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.06);g.gain.linearRampToValueAtTime(0,t+.3);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.35)}
const PROGS=[[0,-3,5,7],[0,5,-3,7],[0,7,-3,5],[-3,5,0,7]];
function note(m){return 440*Math.pow(2,(m-69)/12)}
function startMusic(seed){
  stopMusic();if(!AC)return;const g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1100;
  g.gain.setValueAtTime(0,AC.currentTime);g.gain.linearRampToValueAtTime(.055,AC.currentTime+.25);lp.connect(g);g.connect(master);
  const root=50+seed%5,prog=PROGS[seed%PROGS.length],beat=60/(92+seed%12);let next=AC.currentTime+.05,step=0;
  const sched=()=>{while(next<AC.currentTime+.6){const t=next,bar=Math.floor(step/8),ch=prog[bar%4];
      if(step%8===0)[0,4,7,12].forEach(x=>{const o=AC.createOscillator(),e=AC.createGain();o.type="triangle";o.frequency.value=note(root+ch+x);
        e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.18,t+.25);e.gain.linearRampToValueAtTime(0,t+beat*8);o.connect(e);e.connect(lp);o.start(t);o.stop(t+beat*8+.05)});
      if(step%2===0){const o=AC.createOscillator(),e=AC.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);
        e.gain.setValueAtTime(step%4===0?.9:.35,t);e.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(e);e.connect(g);o.start(t);o.stop(t+.2)}
      else{const b=AC.createBufferSource(),f=AC.createBiquadFilter(),e=AC.createGain();b.buffer=NB;f.type="highpass";f.frequency.value=7000;
        e.gain.setValueAtTime(.25,t);e.gain.exponentialRampToValueAtTime(.001,t+.05);b.connect(f);f.connect(e);e.connect(g);b.start(t,Math.random()*.5);b.stop(t+.06)}
      step++;next+=beat/2}};
  sched();mus={g,iv:setInterval(sched,150)};
}
function stopMusic(){if(!mus)return;clearInterval(mus.iv);const g=mus.g;try{g.gain.cancelScheduledValues(AC.currentTime);g.gain.setValueAtTime(g.gain.value,AC.currentTime);g.gain.linearRampToValueAtTime(0,AC.currentTime+.3)}catch(e){}setTimeout(()=>g.disconnect(),400);mus=null}

// ---------- נגן ----------
// קריינות דרך Web Audio: מפוענחת מראש לסרטונים הבאים, ולכן מתחילה מיד בגלילה
const BUF={};
function loadBuf(id){if(!AC||!AUD[id])return null;if(!BUF[id])BUF[id]=fetch(AUD[id]).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>AC.decodeAudioData(b,res,rej))).catch(()=>{delete BUF[id];return null});return BUF[id]}
const player={buf:null,node:null,t0:0,off:0,playing:false,ver:0,muted:false,
  get currentTime(){if(!this.buf)return 0;const t=this.playing?AC.currentTime-this.t0:this.off;return t%this.buf.duration},
  set currentTime(v){const was=this.playing;this._stop();this.off=Math.max(0,v);if(was)this.play()},
  get duration(){return this.buf?this.buf.duration:0},
  play(){if(!AC||!this.buf||this.playing)return Promise.resolve();if(!this.gn){this.gn=AC.createGain();this.gn.connect(master)}
    const s=AC.createBufferSource();s.buffer=this.buf;s.loop=true;s.connect(this.gn);const o=this.off%this.buf.duration;s.start(0,o);this.t0=AC.currentTime-o;this.node=s;this.playing=true;return Promise.resolve()},
  pause(){if(this.playing){this.off=this.currentTime;this._stop()}},
  _stop(){if(this.node){try{this.node.stop()}catch(e){}this.node.disconnect();this.node=null}this.playing=false},
  async open(id){this._stop();this.off=0;this.buf=null;const my=++this.ver,p=loadBuf(id),b=p&&await p;if(my!==this.ver||!b)return;this.buf=b;if(cur&&!cur.paused)this.play()}};
let cur=null,muted=false;
function activate(el){
  if(cur&&cur.el===el)return;leave();
  const it=el._it;cur={el,it,enter:performance.now(),lastT:0,done:false};
  const i=[...feed.children].indexOf(el);while(feed.children.length<i+4)add();
  if(it.quiz){player.pause();return}
  seenRefs.add(it.id);cur.k=-1;cur.cn=0;cut(true);cur.lastCut=0;
  let h=0;for(const ch of it.id)h=(h*31+ch.charCodeAt(0))>>>0;startMusic(h);
  player.open(it.id);
  const kids=[...feed.children],keep=new Set(kids.slice(Math.max(0,i-1),i+4).map(e=>e._it.id));
  kids.slice(i+1,i+4).forEach(e=>{if(!e._it.quiz)loadBuf(e._it.id)});for(const k in BUF)if(!keep.has(k))delete BUF[k];
}
function leave(){
  if(!cur)return;player.pause();stopMusic();
  if(!cur.it.quiz){const dt=performance.now()-cur.enter;if(cur.done)bump(cur.it.cat,.5);else if(dt<2500)bump(cur.it.cat,-.3);
    cur.el.classList.remove("paused");showChunk(cur.el,cur.it,0)}
  cur=null;
}
function seekSlide(d){
  const it=cur.it,b=it.tim.b,w=it.tim.w,t=player.currentTime;
  let si=b.length-1;while(si>0&&w[b[si]][1]>t+.05)si--;
  if(d>0)si=(si+1)%b.length;else if(t-w[b[si]][1]<1)si=Math.max(0,si-1);
  player.currentTime=Math.max(0,w[b[si]][1]-.05);
  if(cur.paused)togglePause();
}
function togglePause(){cur.paused=!cur.paused;cur.el.classList.toggle("paused",cur.paused);cur.paused?player.pause():player.play().catch(()=>{});if(AC)cur.paused?AC.suspend():AC.resume()}
function tick(){
  if(cur&&!cur.it.quiz){
    const it=cur.it,t=player.currentTime,d=player.duration||1;
    if(t<cur.lastT-1)cur.done=true;cur.lastT=t;
    cur.el.querySelector(".prog i").style.width=(t/d*100)+"%";
    let ci=it.chunks.length-1;while(ci>0&&it.chunks[ci].s>t+.08)ci--;
    if(ci!==cur.el._ci){const nsi=it.chunks[ci].si!==(it.chunks[cur.el._ci]||{}).si;showChunk(cur.el,it,ci);if(nsi||t<cur.lastCut)cut(true);else if(t-cur.lastCut>=2.4)cut(false)}
    cur.el.querySelectorAll(".cap span").forEach(s=>{const x=it.tim.w[+s.dataset.j];s.classList.toggle("on",t+.05>=x[1]&&t<x[2]+.15)});
  }
  requestAnimationFrame(tick);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)activate(e.target)}),{threshold:.6});

// ---------- ממשק ----------
const $=id=>document.getElementById(id);let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
// התחלה אוטומטית בשתי השפות. הדפדפן מתיר קול רק אחרי נגיעה ראשונה
LANGS=["he","en"];player.muted=true;for(let i=0;i<3;i++)add();requestAnimationFrame(tick);
const unlock=()=>{document.removeEventListener("pointerdown",unlock,true);const t=$("start");if(t)t.remove();initAudio();player.muted=muted;
  if(cur&&!cur.it.quiz){player.open(cur.it.id);[...feed.children].slice(1,4).forEach(e=>{if(!e._it.quiz)loadBuf(e._it.id)});let h=0;for(const ch of cur.it.id)h=(h*31+ch.charCodeAt(0))>>>0;startMusic(h)}};
document.addEventListener("pointerdown",unlock,true);
// יציאה מהאפליקציה / מסך נעול: עוצרים הכול, וממשיכים כשחוזרים
function bgPause(){player.pause();if(AC)AC.suspend()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)bgPause();else if(cur&&!cur.paused&&!cur.it.quiz){player.play().catch(()=>{});if(AC)AC.resume()}});
window.addEventListener("pagehide",bgPause);window.addEventListener("blur",()=>{if(document.hidden)bgPause()});
$("btnSound").onclick=()=>{muted=!muted;player.muted=muted;if(master)master.gain.value=muted?0:1;$("btnSound").textContent=muted?"🔇":"🔊"};
$("btnStats").onclick=()=>{
  const max=Math.max(...Object.keys(CATS).map(w));
  $("rows").innerHTML=Object.keys(CATS).sort((a,b)=>w(b)-w(a)).map(c=>`<div class="row"><span>${lab(c,"he")}</span><div class="bar"><i style="width:${w(c)/max*100}%"></i></div><b>${w(c).toFixed(1)}</b></div>`).join("");
  $("panel").classList.add("on");if(cur&&!cur.paused&&!cur.it.quiz)togglePause();
};
$("closePanel").onclick=()=>$("panel").classList.remove("on");
document.addEventListener("keydown",e=>{if(!cur||cur.it.quiz)return;
  if(e.key==="ArrowLeft")seekSlide(1);else if(e.key==="ArrowRight")seekSlide(-1);else if(e.key===" "){e.preventDefault();togglePause()}});
</script>
