["sk","פיזיקה","🌤️","למה השמיים כחולים?","פיזור ריילי",["אור השמש לבן. אז למה השמיים כחולים?","אור השמש מכיל את כל הצבעים. כשהוא פוגע במולקולות האוויר, הוא מתפזר.","אור כחול, בעל אורך גל קצר, מתפזר הרבה יותר מאדום, ומגיע אלינו מכל כיוון בשמיים.","בשקיעה האור עובר דרך יותר אוויר. הכחול מתפזר בדרך, ונשארים כתום ואדום."]],

["ci","כלכלה","💰","ריבית דריבית","ריבית דריבית",["100 ש״ח שגדלים ב־7% בשנה הופכים לכ־760 ש״ח אחרי 30 שנה.","הסוד: מקבלים ריבית גם על הריבית שכבר הצטברה.","כלל ה־72: מחלקים 72 בשיעור הריבית, ומקבלים בערך כמה שנים לוקח לכסף להכפיל את עצמו.","וזה עובד גם הפוך: חוב בריבית גבוהה גדל באותה מהירות."]],

["rs","היסטוריה","🪨","אבן רוזטה","אבן רוזטה",["אבן אחת אפשרה לקרוא שוב כתב שאיש לא הבין במשך כ־1,400 שנה.","היא נמצאה ב־1799 במצרים, ועליה אותו טקסט בשלושה כתבים, כולל יוונית עתיקה.","בזכות היוונית, ב־1822 פיענח ז'אן־פרנסואה שמפוליון את ההירוגליפים."]],
["gp","פיזיקה","🛰️","GPS ואיינשטיין","מערכת מיקום גלובלית",["בלי תורת היחסות של איינשטיין, ה־GPS בטלפון שלך היה טועה בקילומטרים.","השעונים בלוויינים מתקדמים מהר יותר בכ־38 מיקרו־שניות ביום, בגלל המהירות והכבידה.","נשמע זעיר, אבל בלי תיקון השגיאה הייתה מצטברת לכ־10 ק״מ ביום."]],
["tg","ביולוגיה","🐻","דובוני מים","דובוני מים",["החיה העמידה ביותר בעולם באורך של חצי מילימטר בערך.","דובוני מים שורדים קיפאון, ייבוש מוחלט ואפילו חשיפה לריק של החלל.","כשהתנאים קשים, הם מתייבשים ו״משביתים״ את חילוף החומרים, ומתעוררים כשמוסיפים מים."]],

{id:"q2",ref:"oc",cat:"ביולוגיה",q:"כמה לבבות יש לתמנון?",o:["אחד","שניים","שלושה","שמונה"],a:2,x:"שניים לזימים ואחד לשאר הגוף."},
{id:"q3",ref:"bd",cat:"מתמטיקה",q:"כמה אנשים צריך כדי שהסיכוי ליום הולדת משותף יעלה על 50%?",o:["23","100","183","365"],a:0,x:"ב־23 אנשים יש 253 זוגות, וזה מספיק."},
{id:"q4",ref:"mt",cat:"גאוגרפיה",q:"מה עומקה של הנקודה העמוקה באוקיינוס?",o:["כ־3 ק״מ","כ־11 ק״מ","כ־25 ק״מ","כ־100 ק״מ"],a:1,x:"תהום צ'לנג'ר עמוקה כמעט 11 ק״מ, יותר מגובה האוורסט."},
{id:"q5",ref:"rs",cat:"היסטוריה",q:"מה אפשר את פענוח ההירוגליפים?",o:["מגילות ים המלח","אבן רוזטה","הפירמידה הגדולה","ספר המתים"],a:1,x:"אותו טקסט הופיע עליה גם ביוונית עתיקה."}
];

// ---------- אחסון מקומי (רק בדפדפן של הצופה) ----------
let st={};try{st=JSON.parse(localStorage.getItem("curio")||"{}")}catch(e){}
const W=st.w||{},liked=new Set(st.l||[]),saved=new Set(st.s||[]);
const save=()=>{try{localStorage.setItem("curio",JSON.stringify({w:W,l:[...liked],s:[...saved]}))}catch(e){}};
const w=c=>W[c]??1;
const bump=(c,d)=>{W[c]=Math.round(Math.max(.2,Math.min(10,w(c)+d))*100)/100;save()};

// ---------- האלגוריתם ----------
const used=new Set(),quizDone=new Set();let sinceQuiz=0,seenRefs=new Set();
function pick(){
  if(sinceQuiz>=4){const q=Q.find(q=>!quizDone.has(q.id)&&seenRefs.has(q.ref));if(q){quizDone.add(q.id);sinceQuiz=0;return{quiz:q,cat:q.cat}}}
  let pool=T.filter(x=>!used.has(x.id));
  if(!pool.length){used.clear();toast("🔁 סבב חדש");pool=T.slice()}
  let tot=pool.reduce((a,x)=>a+w(x.cat),0),r=Math.random()*tot;
  for(const x of pool){r-=w(x.cat);if(r<=0){used.add(x.id);sinceQuiz++;return x}}
  const x=pool[0];used.add(x.id);return x;
}

// ---------- רינדור ----------
const feed=document.getElementById("feed");
function render(it){
  const el=document.createElement("section");el.className="post";el._it=it;
  const [c1,c2]=CATS[it.cat];el.style.setProperty("--c1",c1);el.style.setProperty("--c2",c2);
  if(it.quiz){
    const q=it.quiz;
    el.innerHTML=`<div class="bg"></div><div class="bigemo">❓</div><div class="quiz"><div class="tag">🧠 בדיקה קטנה · ${q.cat}</div><h3>${q.q}</h3>${q.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}<div class="x">${q.x}<br><small>גללו להמשך ↑</small></div></div>`;
    el.querySelectorAll(".quiz button").forEach(b=>b.onclick=()=>{
      if(el._ans)return;el._ans=1;const i=+b.dataset.i,ok=i===q.a;
      b.classList.add(ok?"ok":"bad");el.querySelector(`[data-i="${q.a}"]`).classList.add("ok");
      el.querySelector(".x").classList.add("on");bump(q.cat,ok?.3:.8);
      if(sound)speak((ok?"נכון! ":"לא בדיוק. ")+q.x);
    });
    return el;
  }
  el.innerHTML=`<div class="bg"></div><div class="bigemo">${it.e}</div>
  <div class="bars">${it.s.map(()=>"<span><i></i></span>").join("")}</div>
  ${it.s.map((t,i)=>`<div class="slide${i?"":" hook"}">${i?"":`<div class="emo">${it.e}</div>`}<p>${t}</p></div>`).join("")}
  <div class="pz">⏸</div>
  <div class="actions">
    <button class="like${liked.has(it.id)?" on":""}">${liked.has(it.id)?"❤️":"🤍"}<small>אהבתי</small></button>
    <button class="sv${saved.has(it.id)?" on":""}">${saved.has(it.id)?"⭐":"☆"}<small>שמירה</small></button>
    <button class="sh">🔗<small>שיתוף</small></button>
  </div>
  <div class="meta"><span class="chip">${it.cat}</span><h2>${it.t}</h2><a href="${it.url}" target="_blank" rel="noopener">📖 מקור: ויקיפדיה ↗</a></div>`;
  const lk=el.querySelector(".like"),sv=el.querySelector(".sv");
  lk.onclick=()=>{const on=!liked.has(it.id);on?liked.add(it.id):liked.delete(it.id);bump(it.cat,on?2:-2);lk.classList.toggle("on",on);lk.firstChild.textContent=on?"❤️":"🤍"};
  sv.onclick=()=>{const on=!saved.has(it.id);on?saved.add(it.id):saved.delete(it.id);bump(it.cat,on?1.5:-1.5);sv.classList.toggle("on",on);sv.firstChild.textContent=on?"⭐":"☆";toast(on?"נשמר ⭐":"הוסר מהשמורים")};
  el.querySelector(".sh").onclick=()=>{const txt=`${it.t} | Curio\n${it.url}`;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("הקישור הועתק 🔗"),()=>toast("לא ניתן להעתיק כאן"))};
  el.addEventListener("click",e=>{
    if(e.target.closest("button,a")||!cur||cur.el!==el)return;
    const x=(e.clientX-el.getBoundingClientRect().left)/el.offsetWidth;
    if(x<.3)go(cur.idx+1);else if(x>.7)go(cur.idx-1);else togglePause();
  });
  return el;
}
function add(){const el=render(pick());feed.appendChild(el);io.observe(el)}

// ---------- קריינות ----------
let sound=true,voice=null,tok=0;const hasTTS="speechSynthesis" in window;
function pickVoice(){if(!hasTTS)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^(he|iw)/i.test(x.lang))||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,cb){if(!hasTTS){cb&&cb();return}const my=++tok;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="he-IL";if(voice)u.voice=voice;u.rate=1.05;u.onend=u.onerror=()=>{if(my===tok&&cb)cb()};speechSynthesis.speak(u)}
function hush(){tok++;if(hasTTS)speechSynthesis.cancel()}

// ---------- נגן ----------
let cur=null;
function activate(el){
  if(cur&&cur.el===el)return;leave();
  const it=el._it;cur={el,it,idx:0,enter:performance.now(),last:performance.now()};
  const i=[...feed.children].indexOf(el);while(feed.children.length<i+4)add();
  if(it.quiz){if(sound)speak(it.quiz.q);return}
  seenRefs.add(it.id);go(0);
}
function leave(){
  if(!cur)return;hush();
  if(!cur.it.quiz){const dt=performance.now()-cur.enter;if(cur.done)bump(cur.it.cat,.5);else if(dt<2500)bump(cur.it.cat,-.3);
    cur.el.classList.remove("paused");cur.el.querySelectorAll(".slide").forEach(s=>s.classList.remove("on"))}
  cur=null;
}
function go(i){
  const n=cur.it.s.length;if(i<0)i=0;
  if(i>=n){cur.done=true;i=0}
  cur.idx=i;cur.elapsed=0;cur.paused=false;cur.el.classList.remove("paused");
  const text=cur.it.s[i];cur.dur=Math.min(9000,Math.max(3500,text.length*70));
  cur.el.querySelectorAll(".slide").forEach((s,k)=>s.classList.toggle("on",k===i));
  const bars=cur.el.querySelectorAll(".bars i");bars.forEach((b,k)=>b.style.width=k<i?"100%":"0");cur.bar=bars[i];
  cur.spoken=!sound;const me=cur;if(sound)speak(text,()=>{me.spoken=true});
}
function togglePause(){cur.paused=!cur.paused;cur.el.classList.toggle("paused",cur.paused);if(cur.paused){hush();cur.spoken=true}}
function tick(now){
  if(cur&&!cur.it.quiz){
    if(!cur.paused)cur.elapsed+=now-cur.last;
    const p=Math.min(1,cur.elapsed/cur.dur);cur.bar.style.width=p*100+"%";
    if(p>=1&&(cur.spoken||cur.elapsed>cur.dur*3))go(cur.idx+1);
  }
  if(cur)cur.last=now;requestAnimationFrame(tick);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)activate(e.target)}),{threshold:.6});

// ---------- ממשק ----------
const $=id=>document.getElementById(id);let tt;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
function setSound(on){sound=on;$("btnSound").textContent=on?"🔊":"🔇";if(!on){hush();if(cur)cur.spoken=true}else if(cur&&!cur.it.quiz)go(cur.idx)}
function begin(withSound){
  $("start").remove();setSound(withSound);
  if(withSound&&hasTTS&&!voice)toast("לא נמצא קול בעברית במכשיר הזה");
  for(let i=0;i<3;i++)add();requestAnimationFrame(tick);
}
$("goMute").onclick=()=>begin(false);$("btnSound").style.display="none";
$("btnSound").onclick=()=>setSound(!sound);
$("btnStats").onclick=()=>{
  const max=Math.max(...Object.keys(CATS).map(w));
  $("rows").innerHTML=Object.keys(CATS).sort((a,b)=>w(b)-w(a)).map(c=>`<div class="row"><span>${c}</span><div class="bar"><i style="width:${w(c)/max*100}%"></i></div><b>${w(c).toFixed(1)}</b></div>`).join("");
  $("panel").classList.add("on");if(cur&&!cur.paused&&!cur.it.quiz)togglePause();
};
$("closePanel").onclick=()=>$("panel").classList.remove("on");
document.addEventListener("keydown",e=>{if(!cur||cur.it.quiz)return;
  if(e.key==="ArrowLeft")go(cur.idx+1);else if(e.key==="ArrowRight")go(cur.idx-1);else if(e.key===" "){e.preventDefault();togglePause()}});
</script>
</body>
</html>
