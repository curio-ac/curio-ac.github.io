name: hebrew voice test
on: workflow_dispatch
permissions:
  contents: write
jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q faster-whisper phonikud phonikud-onnx phonikud-tts soundfile numpy
          wget -q https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
          wget -q -O tts-model.onnx https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/shaul.onnx
          wget -q -O tts-model.config.json https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/model.config.json
      - run: python factory/voice_ab2.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name curio-bot; git config user.email curio-bot@users.noreply.github.com
          git add samples/ab2; git commit -qm "hebrew voice test" && git pull --rebase -q && git push -q || true
