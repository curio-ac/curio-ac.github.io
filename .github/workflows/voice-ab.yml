name: pronunciation test
on:
  workflow_dispatch:
    inputs:
      video:
        default: "content/he/he-d93800dd.json"
permissions:
  contents: write
jobs:
  ab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper phonikud phonikud-onnx
          wget -q https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
      - run: python factory/voice_ab.py ${{ inputs.video }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name curio-bot; git config user.email curio-bot@users.noreply.github.com
          git add samples/ab; git commit -qm "pronunciation test" && git pull --rebase -q && git push -q
