name: יצירת קריינות

on:
  workflow_dispatch:
  push:
    paths: ["content/**"]

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tts.mjs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ vars.VOICE_ID }}
          MODEL_ID: ${{ vars.MODEL_ID }}
      - name: שמירת קבצי האודיו בריפו
        run: |
          git config user.name "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "קריינות חדשה" && git push)
