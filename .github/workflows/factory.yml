name: Curio factory

on:
  workflow_dispatch:
    inputs:
      count:
        description: "videos per language"
        default: "5"
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency: factory

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        lang: [he, en]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factory/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small
      - name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r factory/requirements.txt
          wget -q https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
      - run: python factory/factory.py --lang ${{ matrix.lang }} --count ${{ inputs.count || '20' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: commit
        run: |
          git config user.name "curio-bot"; git config user.email "curio-bot@users.noreply.github.com"
          git add content audio
          git diff --cached --quiet && exit 0
          git commit -m "factory: ${{ matrix.lang }} $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
