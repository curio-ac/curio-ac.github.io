name: Curio factory

on:
  workflow_dispatch:
    inputs:
      count:
        description: "videos per language"
        default: "5"
  schedule:
    - cron: "17 8 * * *"
    - cron: "46 14 * * *"

permissions:
  contents: write

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        lang: [he, en]
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: python3 factory/should_run.py ${{ matrix.lang }}
      - if: steps.chk.outputs.run == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: factory/requirements.txt
      - if: steps.chk.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small
      - if: steps.chk.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-v1
      - if: steps.chk.outputs.run == '1'
        name: install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r factory/requirements.txt
          wget -q https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
          wget -q -O tts-model.onnx https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/shaul.onnx
          wget -q -O tts-model.config.json https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/model.config.json
      - if: steps.chk.outputs.run == '1'
        run: git config user.name curio-bot && git config user.email curio-bot@users.noreply.github.com
      - if: steps.chk.outputs.run == '1'
        run: python factory/factory.py --lang ${{ matrix.lang }} --count ${{ inputs.count || '15' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - if: steps.chk.outputs.run == '1'
        name: commit
        run: |
          git config user.name "curio-bot"; git config user.email "curio-bot@users.noreply.github.com"
          git add content/${{ matrix.lang }} audio/${{ matrix.lang }} factory/queue/${{ matrix.lang }}.json content/feed-${{ matrix.lang }}.json content/status-${{ matrix.lang }}.json
          git diff --cached --quiet && exit 0
          git commit -m "factory: ${{ matrix.lang }} $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
