name: audit
on: workflow_dispatch
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: asr-v1
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
          python factory/audit.py
      - run: |
          git config user.name curio-bot; git config user.email curio-bot@users.noreply.github.com
          git add content; git commit -qm "audit: pull videos below the bar" && git pull --rebase -q && git push -q || true
