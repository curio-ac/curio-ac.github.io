name: preview
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Curio factory", "refresh"]
    types: [completed]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 factory/build_preview.py
      - run: |
          cd dist && git init -q -b preview && git add preview.html
          git -c user.name=curio-bot -c user.email=curio-bot@users.noreply.github.com commit -qm preview
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview
