name: בדיקת קולות

on: workflow_dispatch

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        engine: [gemini, piper, chatterbox, kokoro]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: התקנה
        run: |
          set -e
          case "${{ matrix.engine }}" in
            piper)
              pip install phonikud-tts soundfile
              wget -q https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
              wget -q -O tts-model.onnx https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/shaul.onnx
              wget -q -O tts-model.config.json https://huggingface.co/thewh1teagle/phonikud-tts-checkpoints/resolve/main/model.config.json ;;
            chatterbox)
              pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
              pip install chatterbox-tts phonikud phonikud-onnx numpy
              wget -q https://huggingface.co/thewh1teagle/phonikud-onnx/resolve/main/phonikud-1.0.int8.onnx
              wget -q https://github.com/thewh1teagle/phonikud-chatterbox/releases/download/asset-files-v1/female1.wav ;;
            kokoro)
              sudo apt-get install -y -qq espeak-ng
              pip install kokoro soundfile numpy ;;
          esac
      - run: python scripts/voice_test.py ${{ matrix.engine }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: samples-${{ matrix.engine }}
          path: samples/
          if-no-files-found: ignore

  save:
    needs: gen
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - run: |
          mkdir -p samples && find dl -name "*.wav" -exec cp {} samples/ \; ; ls samples
          for f in samples/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 64k "${f%.wav}.mp3" && rm "$f"; done
          git config user.name "curio-bot"; git config user.email "curio-bot@users.noreply.github.com"
          git add samples; git diff --cached --quiet || (git commit -m "דוגמאות קול" && git push)
