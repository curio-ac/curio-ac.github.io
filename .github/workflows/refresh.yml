name: refresh
on: workflow_dispatch
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && python3 factory/refresh.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name curio-bot; git config user.email curio-bot@users.noreply.github.com
          git add -A content audio; git diff --cached --quiet || (git commit -qm "refresh: trim + images" && git push -q)
